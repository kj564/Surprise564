<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VoxelCraft WASM — MCPE 2013 Native Port</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; color: #e6edf3; }
  #status { position: fixed; inset: 0; z-index: 10; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  #status.hidden { display: none; }
  #status h1 { font-size: 24px; color: #34d399; }
  #status p { font-size: 13px; color: #8b949e; text-align: center; max-width: 560px; line-height: 1.5; }
  #status .log { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-family: monospace; font-size: 11px; color: #c9d1d9; width: 100%; max-width: 700px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
  #status .spinner { width: 28px; height: 28px; border: 2px solid #34d399; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status .progress { width: 100%; max-width: 400px; height: 6px; background: #30363d; border-radius: 3px; overflow: hidden; }
  #status .progress-bar { height: 100%; background: #34d399; transition: width 0.3s; width: 0%; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #88c5ff; image-rendering: pixelated; }
  #hud { position: fixed; left: 8px; top: 8px; z-index: 5; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 6px; font-family: monospace; font-size: 10px; color: #fff; pointer-events: none; line-height: 1.4; }
  #hud .title { color: #34d399; font-weight: 700; }
</style>
</head>
<body>
  <div id="status">
    <h1>VoxelCraft · WASM</h1>
    <div class="spinner"></div>
    <p id="status-text">Pre-loading MCPE 2013 assets…</p>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="log" id="log"></div>
  </div>
  <canvas id="canvas" width="854" height="480"></canvas>
  <div id="hud" style="display:none">
    <div class="title">MCPE·WASM NATIVE</div>
    <div id="hud-info">booting…</div>
  </div>
  <script>
    var logEl = document.getElementById('log');
    var statusEl = document.getElementById('status');
    var statusText = document.getElementById('status-text');
    var progressBar = document.getElementById('progress-bar');
    var hudEl = document.getElementById('hud');
    var hudInfo = document.getElementById('hud-info');
    var canvas = document.getElementById('canvas');

    function logMsg(msg) {
      console.log('[voxelcraft-wasm]', msg);
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    // §Pre-load all MCPE 2013 texture assets ASYNC before WASM main() runs
    // This avoids the synchronous XHR responseType restriction.
    // Textures are decoded to RGBA and stored in window.__mcpeTextures cache.
    // WASM's AppPlatform_emscripten::loadTexture reads from this cache.
    var TEXTURE_LIST = [
      'terrain.png',
      'gui/gui.png',
      'gui/icons.png',
      'gui/title.png',
      'gui/background.png',
      'gui/items.png',
      'gui/itemframe.png',
      'gui/touchgui.png',
      'gui/bg32.png',
      'gui/default_world.png',
      'gui/spritesheet.png',
      'gui/gui_blocks.png',
      'font/default8.png',
      'font/default.png',
      'particles.png',
      'environment/clouds.png',
      'mob/char.png',
      'mob/chicken.png',
      'mob/cow.png',
      'mob/pig.png',
      'mob/sheep.png',
      'mob/sheep_fur.png',
      'mob/zombie.png',
      'mob/skeleton.png',
      'mob/spider.png',
      'mob/creeper.png',
      'mob/pigzombie.png',
      'item/arrows.png',
      'item/sign.png',
      'item/camera.png',
      'art/kz.png',
    ];

    // §Cache for decoded textures: path → {w, h, ptr} (ptr set after WASM ready)
    window.__mcpeTextures = {};
    window.__mcpeAssets = {};  // raw bytes cache

    async function loadTextureAsync(path) {
      try {
        var response = await fetch((location.pathname.includes('mcpe-wasm') ? '../assets/' : './assets/') + path);
        if (!response.ok) { logMsg('[TEX] skip ' + path + ' (HTTP ' + response.status + ')'); return; }
        var blob = await response.blob();
        var url = URL.createObjectURL(blob);

        return new Promise(function(resolve) {
          var img = new Image();
          img.onload = function() {
            var c = document.createElement('canvas');
            c.width = img.width;
            c.height = img.height;
            var ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            var imageData = ctx.getImageData(0, 0, img.width, img.height);
            // Store RGBA pixels as Uint8Array (ptr assigned later when WASM malloc is available)
            window.__mcpeTextures[path] = {
              width: img.width,
              height: img.height,
              pixels: imageData.data  // Uint8ClampedArray
            };
            URL.revokeObjectURL(url);
            resolve();
          };
          img.onerror = function() { logMsg('[TEX] decode error: ' + path); resolve(); };
          img.src = url;
        });
      } catch(e) {
        logMsg('[TEX] fetch error: ' + path + ' — ' + e.message);
      }
    }

    async function loadAssetAsync(path) {
      try {
        var response = await fetch((location.pathname.includes('mcpe-wasm') ? '../assets/' : './assets/') + path);
        if (!response.ok) return;
        var buf = await response.arrayBuffer();
        window.__mcpeAssets[path] = new Uint8Array(buf);
      } catch(e) {}
    }

    async function preloadAll() {
      logMsg('Pre-loading ' + TEXTURE_LIST.length + ' textures…');
      var loaded = 0;
      for (var i = 0; i < TEXTURE_LIST.length; i++) {
        await loadTextureAsync(TEXTURE_LIST[i]);
        loaded++;
        progressBar.style.width = (loaded / TEXTURE_LIST.length * 100) + '%';
        statusText.textContent = 'Pre-loading assets… (' + loaded + '/' + TEXTURE_LIST.length + ')';
      }

      // Also load lang file
      await loadAssetAsync('lang/en_US.lang');

      logMsg('Pre-load complete: ' + Object.keys(window.__mcpeTextures).length + ' textures cached');
      startWasm();
    }

    // §Expose texture cache for WASM
    // WASM calls window.__getTexture(path) → returns [w, h, ptr] or null
    // ptr is allocated via _malloc on first access
    window.__getTexture = function(path) {
      var tex = window.__mcpeTextures[path];
      if (!tex) return null;
      if (!tex.ptr) {
        // Allocate WASM memory and copy pixels
        if (typeof _malloc === 'function') {
          var numBytes = tex.width * tex.height * 4;
          tex.ptr = _malloc(numBytes);
          if (tex.ptr) {
            HEAPU8.set(tex.pixels, tex.ptr);
          }
        }
      }
      return tex.ptr ? {width: tex.width, height: tex.height, ptr: tex.ptr} : null;
    };

    window.__getAsset = function(path) {
      var asset = window.__mcpeAssets[path];
      if (!asset) return null;
      if (!asset.ptr && typeof _malloc === 'function') {
        asset.ptr = _malloc(asset.length);
        if (asset.ptr) HEAPU8.set(asset, asset.ptr);
      }
      return asset.ptr ? {ptr: asset.ptr, size: asset.length} : null;
    };

    function startWasm() {
      logMsg('Starting WASM engine…');
      var Module = {
        canvas: canvas,
        print: function(text) { logMsg('[stdout] ' + text); },
        printErr: function(text) { logMsg('[stderr] ' + text); },
        locateFile: function(path) { return './' + path; },
        preRun: function() { logMsg('preRun — engine about to start'); },
        onRuntimeInitialized: function() { logMsg('WASM runtime initialized ✓'); },
        noInitialRun: false,
      };
      window.Module = Module;

      // Load the WASM glue script
      var script = document.createElement('script');
      script.src = './mcpe_emscripten_full.js';
      script.onload = function() { logMsg('WASM script loaded'); };
      script.onerror = function() { logMsg('ERROR: failed to load WASM script'); };
      document.body.appendChild(script);

      setTimeout(function() {
        statusEl.classList.add('hidden');
        hudEl.style.display = 'block';
        hudInfo.textContent = 'MCPE 2013 engine running (WASM native)';
      }, 8000);
    }

    // Start pre-loading
    preloadAll();
  </script>
</body>
</html>
