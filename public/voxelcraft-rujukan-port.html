  /* ============================================================
   * SECTION: client/gui/Gui (HUD)
   * Mirrors: client/gui/Gui.h / .cpp
   * render order: progress indicator → hearts → bubbles → toolbar →
   * chat → selected-item-name → debug.
   * ============================================================ */
  class Gui {
    constructor(minecraft) {
      this.minecraft = minecraft;
      this.messages = [];
      this.destroyProgress = 0;
      this.selectedItemNameTime = 0;
      this.selectedItemName = '';
      this.chatVisible = false;
      this.hotbarEl = document.getElementById('hotbar');
      this.heartsEl = document.getElementById('hearts');
      this.bubblesEl = document.getElementById('bubbles');
      this.hudTopEl = document.getElementById('hud-top');
      this.breakProgressEl = document.getElementById('break-progress');
      this.toastEl = document.getElementById('toast');
      this.toastTimer = 0;
      this._slotEls = [];
      this._heartEls = [];
      this._initHotbar();
      this._initHearts();
    }
    _initHotbar() {
      this.hotbarEl.innerHTML = '';
      for (let i = 0; i < Inventory.MAX_SELECTION_SIZE; i++) {
        const s = document.createElement('div');
        s.className = 'hslot';
        s.dataset.slot = i;
        const c = document.createElement('canvas');
        c.width = 16; c.height = 16;
        s.appendChild(c);
        const ct = document.createElement('span');
        ct.className = 'ct';
        s.appendChild(ct);
        s.addEventListener('click', () => {
          this.minecraft.player.inventory.selectSlot(i);
          this.renderToolBar();
        });
        this.hotbarEl.appendChild(s);
        this._slotEls.push({ slot: s, canvas: c, count: ct });
      }
    }
    _initHearts() {
      this.heartsEl.innerHTML = '';
      this._heartEls = [];
      for (let i = 0; i < 10; i++) {
        const c = document.createElement('canvas');
        c.width = 13; c.height = 13;
        this.heartsEl.appendChild(c);
        this._heartEls.push(c);
      }
    }
    addMessage(msg) {
      this.messages.push({ text: msg, time: 0 });
      if (this.messages.length > 5) this.messages.shift();
      this.toastEl.textContent = msg;
      this.toastEl.classList.add('show');
      this.toastTimer = 60;
    }
    handleClick(x, y, button) { /* hotbar click handled by event listeners */ }
    handleKeyPressed(key) {
      // Number keys 1-9 select hotbar slot.
      const m = /^Digit([1-9])$/.exec(key);
      if (m) {
        this.minecraft.player.inventory.selectSlot(parseInt(m[1]) - 1);
        this.renderToolBar();
      }
      if (key === 'KeyE') {
        // Inventory: port just opens pause-like inventory screen.
        // For rujukan IngameBlockSelectionScreen — we just show a toast.
        this.addMessage('Inventory (creative): click hotbar slot to swap');
      }
      if (key === 'KeyQ') {
        // Drop item (Player::drop)
        const p = this.minecraft.player;
        const it = p.inventory.getSelected();
        if (it && !it.isNull()) {
          it.count--;
          if (it.count <= 0) p.inventory.setSelected(null);
          this.addMessage('Dropped 1 ' + it.getName());
        }
      }
    }
    tick() {
      // chat fade
      for (let i = this.messages.length - 1; i >= 0; i--) {
        this.messages[i].time++;
        if (this.messages[i].time > 200) this.messages.splice(i, 1);
      }
      if (this.toastTimer > 0) {
        this.toastTimer--;
        if (this.toastTimer === 0) this.toastEl.classList.remove('show');
      }
      // Selected-item name flash
      if (this.selectedItemNameTime > 0) this.selectedItemNameTime--;
    }
    render(a, mouseFree, xMouse, yMouse) {
      this.renderProgressIndicator();
      this.renderHearts();
      this.renderBubbles();
      this.renderToolBar();
      this.renderOnSelectItemNameText();
      this.renderDebug();
    }
    renderProgressIndicator() {
      // Crosshair already in CSS. Break progress overlay only.
      if (this.destroyProgress > 0 && this.destroyProgress < 1) {
        this.breakProgressEl.style.display = 'block';
        const r = this.destroyProgress * 18;
        this.breakProgressEl.style.boxShadow = `0 0 0 2px rgba(255,255,255,0.6) inset, 0 0 0 ${r|0}px rgba(255,255,255,0.0)`;
      } else {
        this.breakProgressEl.style.display = 'none';
      }
    }
    renderHearts() {
      // rujukan Gui::renderHearts — 10 hearts = MAX_HEALTH / 2.
      // Creative mode hides hearts (no health).
      const p = this.minecraft.player;
      if (!p) return;
      const creative = p.userType === 1;
      if (creative) {
        this.heartsEl.style.display = 'none';
        return;
      }
      this.heartsEl.style.display = 'flex';
      const full = Math.floor(p.health / 2);
      const half = (p.health % 2) === 1;
      for (let i = 0; i < 10; i++) {
        const c = this._heartEls[i];
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, 13, 13);
        // background heart
        this._drawHeart(ctx, 'heart_background', 0, 0, 13, 13);
        if (i < full) this._drawHeart(ctx, 'heart', 0, 0, 13, 13);
        else if (i === full && half) this._drawHeart(ctx, 'heart_half', 0, 0, 13, 13);
      }
    }
    _drawHeart(ctx, name, x, y, w, h) {
      const tex = this.minecraft.textures.cache.get(name);
      if (!tex) {
        ctx.fillStyle = name === 'heart_background' ? '#333' : '#cc0000';
        ctx.fillRect(x, y, w, h);
        return;
      }
      ctx.drawImage(tex, x, y, w, h);
    }
    renderBubbles() {
      const p = this.minecraft.player;
      if (!p) return;
      if (p.isInWater()) {
        this.bubblesEl.style.display = 'flex';
        this.bubblesEl.innerHTML = '';
        const air = Math.ceil(p.airSupply / Entity.TOTAL_AIR_SUPPLY * 10);
        for (let i = 0; i < 10; i++) {
          const c = document.createElement('canvas');
          c.width = 13; c.height = 13;
          this.bubblesEl.appendChild(c);
          const ctx = c.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          const empty = i >= air;
          const tex = this.minecraft.textures.cache.get(empty ? 'bubbles_empty' : 'bubbles_full');
          if (tex) ctx.drawImage(tex, 0, 0, 13, 13);
          else { ctx.fillStyle = empty ? '#888' : '#fff'; ctx.fillRect(0, 0, 13, 13); }
        }
      } else {
        this.bubblesEl.style.display = 'none';
      }
    }
    renderToolBar() {
      const inv = this.minecraft.player.inventory;
      for (let i = 0; i < Inventory.MAX_SELECTION_SIZE; i++) {
        const el = this._slotEls[i];
        el.slot.classList.toggle('sel', i === inv.selected);
        const it = inv.getHotbarItem(i);
        const ctx = el.canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, 16, 16);
        if (it && !it.isNull()) {
          const tile = Tile.tiles[it.id];
          const texName = tile ? (tile.getTexture ? tile.getTexture(0) : tile.tex) : null;
          const tex = texName ? this.minecraft.textures.cache.get(texName) : null;
          if (tex) {
            ctx.drawImage(tex, 0, 0, 16, 16);
          } else {
            ctx.fillStyle = '#888'; ctx.fillRect(0, 0, 16, 16);
          }
          el.count.textContent = it.count > 1 ? it.count : '';
        } else {
          el.count.textContent = '';
        }
      }
    }
    renderOnSelectItemNameText() {
      if (this.selectedItemNameTime <= 0) return;
      // Simple: handled by toast.
    }
    renderDebug() {
      const p = this.minecraft.player;
      if (!p) return;
      const lines = [];
      lines.push('<b>VoxelCraft</b> — rujukan faithful port');
      lines.push('XYZ: ' + p.x.toFixed(2) + ' / ' + p.y.toFixed(2) + ' / ' + p.z.toFixed(2));
      lines.push('Mode: ' + (p.userType === 1 ? 'Creative' : 'Survival') +
                 (p.abilities.flying ? ' (flying)' : ''));
      lines.push('Health: ' + p.health + ' / ' + Player.MAX_HEALTH);
      lines.push('Time: ' + this.minecraft.level.getTimeOfDay() + ' / ' + Level.TICKS_PER_DAY);
      lines.push('FPS: ' + this.minecraft.fps);
      this.hudTopEl.innerHTML = lines.join('<br/>');
    }
    getSlotIdAt(x, y) { return -1; }
    getSlotPos(slot) { return [0, 0]; }
  }

  /* ============================================================
   * SECTION: client/Minecraft
   * Mirrors: client/Minecraft.h / .cpp
   * Orchestrator: options, level, player, gameMode, gui, screen,
   * timer, levelRenderer, gameRenderer, particleEngine, soundEngine,
   * textures, mouseHandler, hitResult.
   *
   * Tick flow (Minecraft::tick):
   * 1. gameMode.tick()
   * 2. tickInput()
   * 3. gui.tick()
   * 4. level.tickEntities()
   * 5. level.tick()
   * 6. levelRenderer.tick()
   * 7. particleEngine.tick()
   * 8. screen.tick()
   *
   * update(): timer.advanceTime() → for each tick Minecraft.tick() →
   * gameRenderer.render(a).
   * ============================================================ */
  class Minecraft {
    constructor(canvas) {
      this.canvas = canvas;
      this.options = new Options();
      this.timer = new Timer();
      this.mouseHandler = new MouseHandler();
      this.keys = {};              // KeyboardEvent.code → bool
      this.textures = new Textures();
      this.soundEngine = new SoundEngine();
      this.font = new Font();
      this.hitResult = HitResult.NO_HIT();
      this.screen = null;
      this.level = null;
      this.player = null;
      this.gameMode = null;
      this.gui = null;
      this.levelRenderer = null;
      this.gameRenderer = null;
      this.particleEngine = null;
      this.playerBuildInput = null;
      this.fps = 0;
      this._fpsCount = 0;
      this._fpsLast = performance.now();
      this._lastTime = performance.now();
      this.creativeMode = true;
      this._running = false;
    }
    init() {
      // Renderer setup
      this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: false });
      this.renderer.setPixelRatio(window.devicePixelRatio);
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      this.scene = new THREE.Scene();
      this.scene.background = new THREE.Color(0x88c5ff);
      this.scene.fog = new THREE.Fog(0x88c5ff, 32, 96);
      this.camera = new THREE.PerspectiveCamera(this.options.fov,
        window.innerWidth / window.innerHeight, 0.1, 1000);
      // Lighting (no clouds, no vignette — just ambient + directional sun).
      const hemi = new THREE.HemisphereLight(0xbfdfff, 0x506033, 0.7);
      this.scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xfff4e0, 0.95);
      sun.position.set(40, 80, 20);
      this.scene.add(sun);
      const ambient = new THREE.AmbientLight(0xffffff, 0.35);
      this.scene.add(ambient);
      // Resize handling
      window.addEventListener('resize', () => this._onResize());
      // Input handlers
      this._installInputListeners();
      // Initialize registries
      TileRegistry.init();
      Item.initItems();
      // Initialize GUI
      this.gui = new Gui(this);
      // Show start menu screen
      this.setScreen(new StartMenuScreen());
    }
    _onResize() {
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      if (this.screen) this.screen.init(this, window.innerWidth, window.innerHeight);
    }
    _installInputListeners() {
      const mc = this;
      document.addEventListener('keydown', e => {
        mc.keys[e.code] = true;
        if (mc.screen) {
          mc.screen.keyPressed(e.code);
        } else {
          mc.gui.handleKeyPressed(e.code);
        }
        if (e.code === 'Escape') {
          if (mc.screen) {
            mc.setScreen(null);
          } else if (mc.player) {
            mc.pauseGame();
          }
        }
        // Prevent spacebar scroll
        if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      });
      document.addEventListener('keyup', e => { mc.keys[e.code] = false; });
      document.addEventListener('mousemove', e => mc.mouseHandler.onMouseMove(e));
      // Pointer lock for in-game mouse look
      this.canvas.addEventListener('click', () => {
        if (mc.player && !mc.screen) {
          if (!mc.mouseHandler.locked) this.canvas.requestPointerLock();
        }
      });
      document.addEventListener('pointerlockchange', () => {
        const locked = document.pointerLockElement === this.canvas;
        mc.mouseHandler.onLockChange(locked);
      });
      // Mouse build
      this.canvas.addEventListener('mousedown', e => {
        if (mc.screen) return;
        if (!mc.player) return;
        e.preventDefault();
        if (e.button === 0 && mc.playerBuildInput) mc.playerBuildInput.onMouseDown(0);
        if (e.button === 2 && mc.playerBuildInput) mc.playerBuildInput.onMouseDown(2);
      });
      window.addEventListener('mouseup', e => {
        if (mc.playerBuildInput) {
          if (e.button === 0) mc.playerBuildInput.onMouseUp(0);
          if (e.button === 2) mc.playerBuildInput.onMouseUp(2);
        }
      });
      this.canvas.addEventListener('contextmenu', e => e.preventDefault());
      // Mouse wheel for hotbar selection (rujukan tickInput polls wheel).
      window.addEventListener('wheel', e => {
        if (mc.screen || !mc.player) return;
        const dir = Math.sign(e.deltaY);
        let s = mc.player.inventory.selected + dir;
        if (s < 0) s = Inventory.MAX_SELECTION_SIZE - 1;
        if (s >= Inventory.MAX_SELECTION_SIZE) s = 0;
        mc.player.inventory.selectSlot(s);
        mc.gui.renderToolBar();
      });
    }
    setScreen(screen) {
      if (this.screen) this.screen.removed();
      this.screen = screen;
      const overlay = document.getElementById('overlay');
      if (screen) {
        overlay.classList.remove('hidden');
        screen.init(this, window.innerWidth, window.innerHeight);
        if (screen.renderDOM) screen.renderDOM(overlay);
      } else {
        overlay.classList.add('hidden');
      }
      // Exit pointer lock when entering a screen.
      if (screen && document.pointerLockElement === this.canvas) document.exitPointerLock();
    }
    pauseGame() {
      this.setScreen(new PauseScreen());
    }
    leaveGame() {
      // Quit to title — dispose current level + player.
      if (this.levelRenderer) {
        for (const c of this.levelRenderer.chunks.values()) c.dispose();
        this.levelRenderer.chunks.clear();
      }
      this.level = null;
      this.player = null;
      this.gameMode = null;
      this.setScreen(new StartMenuScreen());
    }
    selectLevel(creative) {
      this.creativeMode = creative;
      // Build level
      const level = new Level(1337, 'rujukan');
      const gen = new LevelGen(level);
      gen.generate();
      // Find a grass-top spawn near world center, spiraling outward.
      // rujukan Level::validateSpawn picks a SafeFloat spawnPos; we mirror it.
      level.spawnPos = this._findSpawn(level, 128, 128);
      this.setLevel(level, creative);
    }
    // Search outward from (cx, cz) for a column whose top tile is grass (id 2),
    // sand (id 12) or any solid above sea level. Returns {x, y, z}.
    _findSpawn(level, cx, cz) {
      for (let r = 0; r < 96; r++) {
        for (let i = -r; i <= r; i++) {
          for (let s of [[cx + i, cz - r], [cx + i, cz + r], [cx - r, cz + i], [cx + r, cz + i]]) {
            const x = s[0], z = s[1];
            if (x < 1 || x >= LevelConstants.LEVEL_WIDTH - 1 ||
                z < 1 || z >= LevelConstants.LEVEL_DEPTH - 1) continue;
            const topY = level.getTopTileY(x, z);
            const topId = level.getTile(x, topY, z);
            if (topId === 2 /* grass */ || topId === 12 /* sand */ || topId === 1 /* stone */) {
              if (topY >= LevelConstants.SEA_LEVEL) {
                return { x, y: topY + 1, z };
              }
            }
          }
        }
      }
      return { x: cx, y: LevelConstants.SEA_LEVEL + 2, z: cz };
    }
    setLevel(level, creative) {
      this.level = level;
      // Create game mode
      this.gameMode = creative ? new CreativeMode(this) : new SurvivalMode(this);
      // Create player via game mode
      this.player = this.gameMode.createPlayer(level);
      this.gameMode.initAbilities(this.player);
      // Spawn at level spawn
      const sp = level.spawnPos || { x: 128, y: LevelConstants.SEA_LEVEL + 2, z: 128 };
      this.player.setPos(sp.x + 0.5, sp.y + 1, sp.z + 0.5);
      this.player.respawnPosition = { x: sp.x, y: sp.y, z: sp.z };
      // Add player to level
      level.addEntity(this.player);
      // Spawn a chicken for the wandering mob demo (rujukan MobSpawner equivalent).
      const chicken = new Chicken(level);
      chicken.setPos(sp.x + 4, sp.y + 1, sp.z + 4);
      level.addEntity(chicken);
      // Wire renderer
      if (!this.levelRenderer) {
        this.levelRenderer = new LevelRenderer(this, this.scene, this.textures);
      }
      this.levelRenderer.setLevel(level);
      this.gameRenderer = new GameRenderer(this, this.camera);
      this.particleEngine = new ParticleEngine(this.levelRenderer);
      // Input wiring
      this.player.input = new KeyboardInput(this.options, this.keys);
      this.player.turnInput = new MouseTurnInput(this.mouseHandler, this.options);
      this.playerBuildInput = new MouseBuildInput();
      this.player.buildInput = this.playerBuildInput;
      // Close start menu
      this.setScreen(null);
      // Initial render of hotbar
      this.gui.renderToolBar();
    }
    setIsCreativeMode(creative) {
      // Switch creative / survival at runtime.
      this.creativeMode = creative;
      const newGM = creative ? new CreativeMode(this) : new SurvivalMode(this);
      newGM.initAbilities(this.player);
      this.gameMode = newGM;
      this.player.userType = creative ? 1 : 0;
      this.player.inventory._isCreative = creative;
      this.player.inventory.clearInventoryWithDefault();
      this.gui.renderToolBar();
      this.gui.addMessage('Switched to ' + (creative ? 'Creative' : 'Survival') + ' mode');
    }
    respawnPlayer() {
      this.player.respawn();
    }
    tickInput() {
      // rujukan Minecraft::tickInput: if a screen exists and !passEvents dispatch to it
      // and bail. Otherwise poll mouse wheel + keys for hotbar / build.
      if (this.screen) {
        if (!this.screen.passEvents) return;
      }
      // Mouse turn (apply to player)
      if (this.player && this.player.turnInput) this.player.turnInput.tick(this.player);
      // Build input tickBuild
      if (this.playerBuildInput) this.playerBuildInput.tickBuild(this);
    }
    handleBuildAction() {
      // rujukan Minecraft::handleBuildAction (handled in MouseBuildInput.tickBuild).
    }
    tick(nTick, maxTick) {
      // Mirror Minecraft::tick() order
      for (let i = 0; i < nTick; i++) {
        this.gameMode.tick();
        // commandServer.tick() — skip (no multiplayer)
        this.tickInput();
        this.gui.tick();
        // gameRenderer.tick — interpolation prep (no-op for port)
        if (this.gameRenderer) this.gameRenderer.tick();
        // levelRenderer.tick — chunk dirty queue
        if (this.levelRenderer) this.levelRenderer.tick();
        // level.tickEntities + level.tick
        this.level.tickEntities();
        this.level.tick();
        // level.animateTick — random particle effects (skip for port)
        // textures.tick — animation (skip for port)
        // particleEngine.tick
        if (this.particleEngine) this.particleEngine.tick();
        // screen.tick
        if (this.screen) this.screen.tick();
        // soundEngine.update
        this.soundEngine.update(this.player, 0);
      }
    }
    update() {
      const ticks = this.timer.advanceTime();
      if (this.level && this.player) {
        this.tick(ticks, Timer.MAX_TICKS_PER_UPDATE);
      }
      // FPS counter
      this._fpsCount++;
      const now = performance.now();
      if (now - this._fpsLast > 1000) {
        this.fps = this._fpsCount;
        this._fpsCount = 0;
        this._fpsLast = now;
      }
      // Render
      this.render(this.timer.a);
    }
    render(a) {
      if (this.gameRenderer && this.level && this.player) {
        this.gameRenderer.render(a);
        if (this.gameMode) this.gameMode.render(a);
        if (this.gui) this.gui.render(a, false, 0, 0);
      }
      this.renderer.render(this.scene, this.camera);
    }
    reloadOptions() {}
    run() {
      this._running = true;
      const loop = () => {
        if (!this._running) return;
        this.update();
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }
  }

  /* ============================================================
   * SECTION: Bootstrap
   * Mirrors: client/Minecraft::init() + main()
   * Loads textures, inits registries, then starts the loop.
   * ============================================================ */
  function bootstrap() {
    const canvas = document.getElementById('game');
    const minecraft = new Minecraft(canvas);
    minecraft.init();
    // List of all textures needed (block + UI).
    const blockTextures = [
      'stone', 'grass_top', 'grass_side', 'dirt', 'cobblestone',
      'planks_oak', 'bedrock', 'water_still', 'lava_still',
      'sand', 'gravel', 'gold_ore', 'iron_ore', 'coal_ore',
      'log_oak', 'log_oak_top', 'leaves_oak_opaque',
      'glass', 'brick', 'tnt_side', 'tnt_top', 'bookshelf',
      'stonebrick_mossy', 'obsidian', 'torch_on',
      'diamond_ore', 'diamond_block', 'crafting_table_top',
      'crafting_table_front', 'crafting_table_side',
      'furnace_front_off', 'furnace_side', 'furnace_top',
      'ice', 'netherrack', 'glowstone', 'chest',
    ];
    const uiTextures = [
      'heart', 'heart_background', 'heart_half', 'heart_flash',
      'bubbles_full', 'bubbles_empty',
      'hotbar_start_cap', 'hotbar_end_cap', 'highlight_slot',
      'hotbar_0', 'hotbar_1', 'hotbar_2', 'hotbar_3', 'hotbar_4',
      'hotbar_5', 'hotbar_6', 'hotbar_7', 'hotbar_8',
    ];
    const all = blockTextures.concat(uiTextures);
    minecraft.textures.load(all, () => {
      // Hide loading screen, start loop.
      document.getElementById('loading').classList.add('hidden');
      minecraft.run();
    });
    // Expose for debugging
    window.minecraft = minecraft;
  }

  // Wait for fonts, then bootstrap.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
  </script>
</body>
</html>
