<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxelCraft — Rujukan Faithful Port</title>
<style>
/* ============================================================
 * VoxelCraft — faithful browser port of rujukan/ MCPE 2013 C++
 * minimal CSS only: canvas, hud, hotbar, overlay, loading.
 * NO vignette / clouds / sprint-fov kick (per MODLOG task spec).
 * ============================================================ */
@font-face {
  font-family: 'Minecraft Ten';
  src: url('./VoxelCraft/font/minecraft-ten.ttf') format('truetype');
  font-display: swap;
}
:root { color-scheme: light; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #88c5ff;
  font-family: 'Minecraft Ten', 'Segoe UI', system-ui, -apple-system, sans-serif;
  user-select: none; color: #fff;
}
#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }

#crosshair {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 22px; height: 22px; pointer-events: none; z-index: 5;
  mix-blend-mode: difference;
}
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
#crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
#crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

#hotbar {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; gap: 1px; padding: 0; z-index: 5; background: transparent;
}
.hslot {
  width: 24px; height: 24px; position: relative; cursor: pointer;
  background: rgba(20,20,20,0.55);
  display: flex; align-items: center; justify-content: center;
  image-rendering: pixelated;
}
.hslot.sel { background: rgba(255,255,255,0.0); outline: 2px solid #fff; }
.hslot canvas { width: 18px; height: 18px; image-rendering: pixelated; }
.hslot .ct { position: absolute; bottom: 1px; right: 2px; font-size: 10px;
  color: #fff; text-shadow: 1px 1px 0 #000; }

#hud {
  position: fixed; top: 6px; left: 6px; z-index: 5;
  font-size: 12px; line-height: 1.4; text-shadow: 1px 1px 0 #000;
  background: rgba(0,0,0,0.30); padding: 4px 8px; color: #fff;
  pointer-events: none; white-space: pre;
}

#hearts {
  position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%);
  display: flex; gap: 1px; z-index: 5; pointer-events: none;
}
#hearts canvas { width: 11px; height: 11px; image-rendering: pixelated; }

#overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(0,0,0,0.55);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: 'Minecraft Ten', sans-serif; color: #fff;
  text-shadow: 1px 1px 0 #000;
}
#overlay.hidden { display: none; }
#overlay .panel {
  width: min(360px, 92vw); padding: 16px;
  background: rgba(0,0,0,0.7); border: 2px solid #555;
}
#overlay h1 { font-size: 18px; margin-bottom: 8px; text-align: center; }
#overlay button {
  display: block; width: 100%; padding: 6px 0; margin: 6px 0;
  background: #6a6a6a; color: #fff; border: 2px solid #2a2a2a;
  font-family: 'Minecraft Ten', sans-serif; font-size: 12px;
  cursor: pointer; text-shadow: 1px 1px 0 #000;
}
#overlay button:hover { background: #8a8a8a; color: #ffffa0; }
#overlay button.disabled { color: #a0a0a0; cursor: not-allowed; }

#loading {
  position: fixed; inset: 0; z-index: 20;
  background: #444; color: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'Minecraft Ten', sans-serif;
}
#loading.hidden { display: none; }
.spinner {
  width: 32px; height: 32px; border: 4px solid #888;
  border-top-color: #fff; border-radius: 50%;
  animation: spin 1s linear infinite; margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

 *   world/phys/            Vec3, AABB, HitResult

 *   world/level/tile/      Tile base + subclasses + TileRegistry

 *   client/                Minecraft, Timer, Options, MouseHandler
 *   client/renderer/       Tesselator, Textures, Chunk, LevelRenderer, GameRenderer
 *   client/particle/       ParticleEngine

/* =====================================================================
 * SECTION: world/phys/Vec3
 * rujukan Vec3.h — float x,y,z; arithmetic ops used by hit-test, light, etc.
 * ===================================================================== */
class Vec3 {
  constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
  set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
  copy(o) { this.x = o.x; this.y = o.y; this.z = o.z; return this; }
  clone() { return new Vec3(this.x, this.y, this.z); }
  add(o) { return new Vec3(this.x + o.x, this.y + o.y, this.z + o.z); }
  addScaled(o, s) { return new Vec3(this.x + o.x * s, this.y + o.y * s, this.z + o.z * s); }
  sub(o) { return new Vec3(this.x - o.x, this.y - o.y, this.z - o.z); }
  mul(s) { return new Vec3(this.x * s, this.y * s, this.z * s); }
  dot(o) { return this.x * o.x + this.y * o.y + this.z * o.z; }
  length() { return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z); }
  lengthSqr() { return this.x * this.x + this.y * this.y + this.z * this.z; }
  distanceTo(o) { return this.sub(o).length(); }
  distanceToSqr(x, y, z) {
    const dx = this.x - x, dy = this.y - y, dz = this.z - z;
    return dx * dx + dy * dy + dz * dz;
  }
  normalize() {
    const l = this.length();
    return l > 1e-9 ? new Vec3(this.x / l, this.y / l, this.z / l) : new Vec3(0, 0, 0);
  }
  static lerp(a, b, t) {
    return new Vec3(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);
  }
}


/* =====================================================================
 * SECTION: world/phys/AABB
 * rujukan AABB.h — float x0,y0,z0,x1,y1,z1; clip/clipXCollide/clipYCollide/
 * clipZCollide/intersects/grow/expand/move. VERIFIED formulas.
 * ===================================================================== */
class AABB {
  constructor(x0, y0, z0, x1, y1, z1) {
    this.x0 = x0; this.y0 = y0; this.z0 = z0;
    this.x1 = x1; this.y1 = y1; this.z1 = z1;
  }
  set(x0, y0, z0, x1, y1, z1) {
    this.x0 = x0; this.y0 = y0; this.z0 = z0;
    this.x1 = x1; this.y1 = y1; this.z1 = z1; return this;
  }
  clone() { return new AABB(this.x0, this.y0, this.z0, this.x1, this.y1, this.z1); }
  move(xa, ya, za) {
    return new AABB(this.x0 + xa, this.y0 + ya, this.z0 + za,
                    this.x1 + xa, this.y1 + ya, this.z1 + za);
  }
  expand(xa, ya, za) {
    let x0 = this.x0, y0 = this.y0, z0 = this.z0;
    let x1 = this.x1, y1 = this.y1, z1 = this.z1;
    if (xa < 0) x0 += xa; else x1 += xa;
    if (ya < 0) y0 += ya; else y1 += ya;
    if (za < 0) z0 += za; else z1 += za;
    return new AABB(x0, y0, z0, x1, y1, z1);
  }
  grow(xa, ya, za) {
    return new AABB(this.x0 - xa, this.y0 - ya, this.z0 - za,
                    this.x1 + xa, this.y1 + ya, this.z1 + za);
  }
  intersects(o) {
    return this.x1 > o.x0 && o.x1 > this.x0 &&
           this.y1 > o.y0 && o.y1 > this.y0 &&
           this.z1 > o.z0 && o.z1 > this.z0;
  }
  contains(v) {
    return v.x >= this.x0 && v.x <= this.x1 &&
           v.y >= this.y0 && v.y <= this.y1 &&
           v.z >= this.z0 && v.z <= this.z1;
  }
  /* AABB::clipXCollide — VERIFIED AABB.cpp clip helper for X axis */
  clipXCollide(o, xa) {
    if (o.y1 <= this.y0 || o.y0 >= this.y1) return xa;
    if (o.z1 <= this.z0 || o.z0 >= this.z1) return xa;
    if (xa > 0 && o.x1 <= this.x0) {
      const d = this.x0 - o.x1;
      if (d < xa) xa = d;
    } else if (xa < 0 && o.x0 >= this.x1) {
      const d = this.x1 - o.x0;
      if (d > xa) xa = d;
    }
    return xa;
  }
  clipYCollide(o, ya) {
    if (o.x1 <= this.x0 || o.x0 >= this.x1) return ya;
    if (o.z1 <= this.z0 || o.z0 >= this.z1) return ya;
    if (ya > 0 && o.y1 <= this.y0) {
      const d = this.y0 - o.y1;
      if (d < ya) ya = d;
    } else if (ya < 0 && o.y0 >= this.y1) {
      const d = this.y1 - o.y0;
      if (d > ya) ya = d;
    }
    return ya;
  }
  clipZCollide(o, za) {
    if (o.x1 <= this.x0 || o.x0 >= this.x1) return za;
    if (o.y1 <= this.y0 || o.y0 >= this.y1) return za;
    if (za > 0 && o.z1 <= this.z0) {
      const d = this.z0 - o.z1;
      if (d < za) za = d;
    } else if (za < 0 && o.z0 >= this.z1) {
      const d = this.z1 - o.z0;
      if (d > za) za = d;
    }
    return za;
  }
  /* AABB::clip(a, b) — VERIFIED: ray clip returning HitResult or null */
  clip(from, to) {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
    let t0 = -Infinity, t1 = Infinity, face = -1;
    // Y axis (per rujukan: order is Y first then X then Z)
    if (Math.abs(dy) < 1e-9) {
      if (from.y < this.y0 || from.y > this.y1) return null;
    } else {
      const a = (this.y0 - from.y) / dy, b = (this.y1 - from.y) / dy;
      const tmin = Math.min(a, b), tmax = Math.max(a, b);
      if (tmin > t0) { t0 = tmin; face = dy > 0 ? 0 : 1; }
      if (tmax < t1) t1 = tmax;
      if (t0 > t1) return null;
    }
    if (Math.abs(dx) < 1e-9) {
      if (from.x < this.x0 || from.x > this.x1) return null;
    } else {
      const a = (this.x0 - from.x) / dx, b = (this.x1 - from.x) / dx;
      const tmin = Math.min(a, b), tmax = Math.max(a, b);
      if (tmin > t0) { t0 = tmin; face = dx > 0 ? 4 : 5; }
      if (tmax < t1) t1 = tmax;
      if (t0 > t1) return null;
    }
    if (Math.abs(dz) < 1e-9) {
      if (from.z < this.z0 || from.z > this.z1) return null;
    } else {
      const a = (this.z0 - from.z) / dz, b = (this.z1 - from.z) / dz;
      const tmin = Math.min(a, b), tmax = Math.max(a, b);
      if (tmin > t0) { t0 = tmin; face = dz > 0 ? 2 : 3; }
      if (tmax < t1) t1 = tmax;
      if (t0 > t1) return null;
    }
    if (t0 < 0 || t0 > 1) return null;
    const pos = new Vec3(from.x + dx * t0, from.y + dy * t0, from.z + dz * t0);
    return { type: 1, pos, f: face, dist: t0 };
  }
}


/* =====================================================================
 * SECTION: world/phys/HitResult
 * rujukan HitResult.h — int type (0=MISS, 1=TILE, 2=ENTITY); int x,y,z; int f; Vec3 pos.
 * ===================================================================== */
class HitResult {
  constructor(type = 0, x = 0, y = 0, z = 0, f = -1, pos = null, entity = null) {
    this.type = type;
    this.x = x; this.y = y; this.z = z;
    this.f = f;
    this.pos = pos;
    this.entity = entity;
    this.indirectHit = false;
  }
  static get MISS() { return 0; }
  static get TILE()  { return 1; }
  static get ENTITY(){ return 2; }
  isHit() { return this.type !== HitResult.MISS; }
}


/* =====================================================================

 * VERIFIED LevelConstants.h (lines 1–14)

const LevelConstants = {

  CHUNK_WIDTH: 16,

/* Math helpers — VERIFIED Mth namespace equivalents */
const Mth = {
  PI: Math.PI,
  DEGRAD: Math.PI / 180,
  floor: Math.floor,
  ceil: Math.ceil,
  intFloorDiv: (a, b) => {
    const q = Math.floor(a / b);
    return q * b !== a * 1 ? q : q; // simplified to standard floor for positive b
  },
  clamp: (v, lo, hi) => v < lo ? lo : v > hi ? hi : v,
  sqrt: Math.sqrt,
  sin: Math.sin,
  cos: Math.cos,
  atan: Math.atan,
  atan2: Math.atan2,
  abs: Math.abs,
  Min: Math.min,
  Max: Math.max,
};

/* Simple LCG Random — VERIFIED: r = r * 3 + 1013904223, seed 42184323 */
class JavaRandom {
  constructor(seed = 1) { this.seed = seed >>> 0; }
  nextInt(bound = 0x7fffffff) {
    this.seed = (this.seed * 3 + 1013904223) >>> 0;
    if (bound <= 0) return this.seed | 0;
    return (this.seed >>> 0) % bound;
  }
  nextFloat() {
    this.seed = (this.seed * 3 + 1013904223) >>> 0;
    return (this.seed >>> 8) / 0x7fffff; // ~[0,1)
  }
}


/* =====================================================================
 * SECTION: world/level/Material
 * rujukan world/level/material/Material.h — material flags drive
 * isSolid / blocksLight / isAlwaysDestroyable / isReplaceable / isLiquid.
 * ===================================================================== */
class Material {
  constructor(name, opts = {}) {
    this.name = name;
    this.isSolid = opts.isSolid !== undefined ? opts.isSolid : true;
    this.blocksMotion = opts.blocksMotion !== undefined ? opts.blocksMotion : true;
    this.blocksLight = opts.blocksLight !== undefined ? opts.blocksLight : true;
    this.isAlwaysDestroyable = opts.isAlwaysDestroyable !== undefined ? opts.isAlwaysDestroyable : true;
    this.isReplaceable = opts.isReplaceable || false;
    this.isLiquid = opts.isLiquid || false;
  }
  isSolidMethod() { return this.isSolid; }
  blocksMotionMethod() { return this.blocksMotion; }
  blocksLightMethod() { return this.blocksLight; }
  isAlwaysDestroyableMethod() { return this.isAlwaysDestroyable; }
  isReplaceableMethod() { return this.isReplaceable; }
}
Material.air = new Material('air', {
  isSolid: false, blocksMotion: false, blocksLight: false,
  isAlwaysDestroyable: true, isReplaceable: true
});
Material.stone = new Material('stone', { isAlwaysDestroyable: false });
Material.wood = new Material('wood');
Material.dirt = new Material('dirt');
Material.sand = new Material('sand');
Material.gravel = new Material('gravel');
Material.water = new Material('water', {

});
Material.lava = new Material('lava', {

Material.glass = new Material('glass');
Material.leaves = new Material('leaves', { blocksLight: false });
Material.plant = new Material('plant', {
  isSolid: false, blocksMotion: false, blocksLight: false,

});
Material.metal = new Material('metal', { isAlwaysDestroyable: false });
Material.clay = new Material('clay');
Material.ice = new Material('ice', { isAlwaysDestroyable: false });
Material.topSnow = new Material('topSnow', { isAlwaysDestroyable: false });
Material.snow = new Material('snow', { isAlwaysDestroyable: false });


/* =====================================================================
 * SECTION: world/level/tile/SoundType
 * rujukan SoundType in Tile.h:30-67. (name, breakSound, stepSound, volume, pitch)
 * ===================================================================== */
class SoundType {
  constructor(name, volOrBreak, pitchOrVol, optPitch) {
    if (typeof pitchOrVol === 'number' && optPitch === undefined) {
      this.breakSound = 'step.' + name;
      this.stepSound = 'step.' + name;
      this.volume = volOrBreak;
      this.pitch = pitchOrVol;
    } else {
      this.breakSound = volOrBreak;
      this.stepSound = 'step.' + name;
      this.volume = pitchOrVol;
      this.pitch = optPitch;
    }
  }
}
SoundType.SOUND_NORMAL = new SoundType('stone', 1, 1);
SoundType.SOUND_WOOD   = new SoundType('wood', 1, 1);
SoundType.SOUND_GRAVEL = new SoundType('gravel', 1, 1);
SoundType.SOUND_GRASS  = new SoundType('grass', 0.5, 1);
SoundType.SOUND_STONE  = new SoundType('stone', 1, 1);
SoundType.SOUND_METAL  = new SoundType('stone', 1, 1.5);
SoundType.SOUND_GLASS  = new SoundType('stone', 'random.glass', 1, 1);
SoundType.SOUND_CLOTH  = new SoundType('cloth', 1, 1);
SoundType.SOUND_SAND   = new SoundType('sand', 'step.gravel', 1, 1);
SoundType.SOUND_SILENT = new SoundType('', 0, 0);


/* =====================================================================
 * SECTION: world/level/tile/Tile
 * rujukan world/level/tile/Tile.h + Tile.cpp — base class with shape AABB,
 * texture, friction, destroySpeed, lightBlock, lightEmission, material.
 * VERIFIED field defaults & builder methods.
 * ===================================================================== */
const TileShape = {
  INVISIBLE: -1, BLOCK: 0, CROSS_TEXTURE: 1, TORCH: 2, FIRE: 3,
  WATER: 4, RED_DUST: 5, ROWS: 6, DOOR: 7, LADDER: 8, RAIL: 9,
  STAIRS: 10, FENCE: 11, LEVER: 12, CACTUS: 13, BED: 14,
  DIODE: 15, IRON_FENCE: 18, STEM: 19, FENCE_GATE: 21,
  ENTITYTILE_ANIMATED: 22,
};

class Tile {
  constructor(id, tex, material = Material.stone) {
    if (tex === undefined) { tex = 1; material = Material.stone; }
    this.id = id;
    this.tex = tex;
    this.material = material;
    this.category = -1;
    this.gravity = 1.0;
    this.friction = 0.6;
    this.soundType = SoundType.SOUND_NORMAL;
    this.destroySpeed = 0.0;
    this.explosionResistance = 0.0;
    this.lightBlock = 0;
    this.lightEmission = 0;
    this.renderLayer = 0;
    this.renderShape = TileShape.BLOCK;
    this.isTileEntity = false;
    // shape AABB: VERIFIED default (0,0,0,1,1,1)
    this.xx0 = 0; this.yy0 = 0; this.zz0 = 0;
    this.xx1 = 1; this.yy1 = 1; this.zz1 = 1;
    // texture names: top/side/bottom (for per-face texture lookup, set later)
    this.texTop = null; this.texSide = null; this.texBottom = null;
  }
  /* Builder methods (chainable) — VERIFIED Tile.cpp setters */
  setDestroyTime(d) {
    this.destroySpeed = d;
    if (this.explosionResistance < d * 5) this.explosionResistance = d * 5;
    return this;
  }
  setExplodeable(r) { this.explosionResistance = r * 3; return this; }
  setSoundType(s) { this.soundType = s; return this; }
  setCategory(c) { this.category = c; return this; }
  setDescriptionId(d) { this.descriptionId = d; return this; }
  setLightBlock(i) { this.lightBlock = i; return this; }
  setLightEmission(f) {
    // VERIFIED Tile.cpp:675-697 — lightEmission[id] = (int)(MAX_BRIGHTNESS * f)
    this.lightEmission = Math.floor(15 * f);
    return this;
  }
  setTicking(t) { if (t) this.shouldTick = true; return this; }
  setRenderLayer(l) { this.renderLayer = l; return this; }
  setRenderShape(s) { this.renderShape = s; return this; }
  setShape(x0, y0, z0, x1, y1, z1) {
    this.xx0 = x0; this.yy0 = y0; this.zz0 = z0;
    this.xx1 = x1; this.yy1 = y1; this.zz1 = z1;
    return this;
  }
  init() { return this; }
  /* VERIFIED Tile::getDestroyProgress — Tile.cpp:391-395 */
  getDestroyProgress(player) {
    if (this.destroySpeed < 0) return 0;
    if (!player.canDestroy(this)) return 1 / this.destroySpeed / 100.0;
    return (player.getDestroySpeed(this) / this.destroySpeed) / 30.0;

 * SECTION: world/level/chunk/LevelChunk
 * rujukan world/level/chunk/LevelChunk.cpp — block storage layout:
 *   blocks[(x<<11) | (z<<7) | y] — VERIFIED index formula
 *   heightmap[(z<<4) | x]
 *   DataLayer nibble storage for skyLight/blockLight/data
 * ===================================================================== */
class DataLayer {
  constructor(size) {
    this.length = size >> 1;
    this.data = new Uint8Array(this.length);
  }
  // VERIFIED DataLayer.h:2886-2903
  get(pos) {
    const slot = pos >> 1;
    if (pos & 1) return (this.data[slot] >> 4) & 0xf;
    return this.data[slot] & 0xf;
  }
  set(pos, val) {
    const slot = pos >> 1;
    val = val & 0xf;
    if (pos & 1) this.data[slot] = (this.data[slot] & 0x0f) | (val << 4);
    else         this.data[slot] = (this.data[slot] & 0xf0) | val;
  }
  getByXYZ(x, y, z) { return this.get((x << 11) | (z << 7) | y); }
  setByXYZ(x, y, z, v) { return this.set((x << 11) | (z << 7) | y, v); }
  setAll(v) {
    const b = (v & 0xf) | (v << 4);
    this.data.fill(b);
  }
}

class LevelChunk {
  constructor(level, x, z, blocks = null) {
    this.level = level;
    this.x = x;
    this.z = z;
    this.xt = x * 16;
    this.zt = z * 16;
    this.blocks = blocks || new Uint8Array(32768);
    this.data = new DataLayer(32768);
    this.skyLight = new DataLayer(32768);
    this.blockLight = new DataLayer(32768);
    this.heightmap = new Uint8Array(256);
    this.updateMap = new Uint8Array(256);
    this.minHeight = 127;
    this.unsaved = false;
    this.terrainPopulated = false;
    this.dontSave = false;
  }
  // VERIFIED LevelChunk.cpp:368-371
  getTile(x, y, z) {
    if (y < 0 || y >= 128) return 0;
    return this.blocks[(x << 11) | (z << 7) | y];
  }
  setTileRaw(x, y, z, t) { this.blocks[(x << 11) | (z << 7) | y] = t; }
  // VERIFIED LevelChunk.cpp:59-142 (simplified — no light recomputation)
  setTile(x, y, z, t) {
    if (y < 0 || y >= 128) return false;
    const idx = (x << 11) | (z << 7) | y;
    const old = this.blocks[idx];
    if (old === t) return false;
    this.blocks[idx] = t & 0xff;
    this.data.set(idx, 0);
    // heightmap update — VERIFIED recalcHeight
    if (Tile.lightBlock[t & 0xff] !== 0) {
      if (y >= this.heightmap[(z << 4) | x]) {
        this.recalcHeight(x, y + 1, z);
      }
    } else {
      const oldH = this.heightmap[(z << 4) | x];
      if (y === oldH - 1) this.recalcHeight(x, y, z);
    }
    this.unsaved = true;
    return true;
  }
  // VERIFIED LevelChunk.cpp:149-151, 373-377
  getData(x, y, z) { return this.data.getByXYZ(x, y, z); }
  setData(x, y, z, v) { this.data.setByXYZ(x, y, z, v); }
  // VERIFIED LevelChunk.cpp:439-442
  isSkyLit(x, y, z) { return y >= this.heightmap[(z << 4) | x]; }
  // VERIFIED LevelChunk.cpp:346-349
  getHeightmap(x, z) { return this.heightmap[(z << 4) | x]; }
  // VERIFIED LevelChunk.cpp:154-204
  recalcHeightmap() {
    let min = 127;
    for (let x = 0; x < 16; x++) {
      for (let z = 0; z < 16; z++) {
        let y = 127;
        const p = x << 11 | z << 7;
        while (y > 0 && Tile.lightBlock[this.blocks[p + y - 1] & 0xff] === 0) y--;
        this.heightmap[(z << 4) | x] = y;
        if (y < min) min = y;
        // VERIFIED: skyLight top-down propagation
        let br = 15;
        for (let yy = 127; yy > 0 && br > 0; yy--) {
          br -= Tile.lightBlock[this.blocks[p + yy] & 0xff];
          if (br > 0) this.skyLight.set(p + yy, br);
        }
      }
    }
    this.minHeight = min;
  }
  recalcHeight(x, yTop, z) {
    let y = 127;
    const p = x << 11 | z << 7;
    while (y > 0 && Tile.lightBlock[this.blocks[p + y - 1] & 0xff] === 0) y--;
    this.heightmap[(z << 4) | x] = y;
  }
  // VERIFIED LevelChunk.cpp:379-403
  getBrightness(layer, x, y, z) {
    if (layer === 0) return this.skyLight.getByXYZ(x, y, z);
    if (layer === 1) return this.blockLight.getByXYZ(x, y, z);
    return 0;
  }
  setBrightness(layer, x, y, z, b) {
    if (layer === 0) this.skyLight.setByXYZ(x, y, z, b);
    else if (layer === 1) this.blockLight.setByXYZ(x, y, z, b);
  }
  getRawBrightness(x, y, z, skyDampen) {
    let light = this.skyLight.getByXYZ(x, y, z);
    if (light > 0) LevelChunk.touchedSky = true;
    light -= skyDampen;
    const block = this.blockLight.getByXYZ(x, y, z);
    if (block > light) light = block;
    return light;
  }
}

class Level {
  constructor(seed = 0, isClientSide = false) {
    this.seed = seed;
    this.isClientSide = isClientSide;
    this.time = 0;
    this.tickCount = 0;
    this.skyDarken = 0;
    this.entities = [];
    this.players = [];
    this.tileEntities = [];
    this.random = new JavaRandom(1);
    // VERIFIED LCG seed constants — Level.cpp:2051-2052
    this._randValue = 42184323;
    this._addend = 1013904223;
    this.chunks = new Map();
    this.difficulty = 0; // PEACEFUL
    this.spawnPos = { x: 128, y: 64, z: 128 };
    this.listeners = [];
    this.noNeighborUpdate = false;
    // VERIFIED LightLayer constants
    this.brightnessRamp = new Array(16);
    const ambientLight = 0.05;
    for (let i = 0; i <= 15; i++) {
      const v = 1 - i / 16;
      this.brightnessRamp[i] = ((1 - v) / (v * 3 + 1)) * (1 - ambientLight) + ambientLight * 3;
    }
  }
  getChunk(cx, cz) {
    const key = cx + ',' + cz;
    let c = this.chunks.get(key);
    if (!c) {
      c = new LevelChunk(this, cx, cz);
      this.chunks.set(key, c);
    }
    return c;
  }
  hasChunk(cx, cz) { return this.chunks.has(cx + ',' + cz); }
  inRange(x, y, z) {
    return x >= 0 && x < 256 && y >= 0 && y < 128 && z >= 0 && z < 256;
  }
  // VERIFIED Level.cpp:589-593 (tileAt)
  getTile(x, y, z) {
    if (x < 0 || z < 0 || x >= 256 || z >= 256) return 0;
    if (y < 0 || y >= 128) return 0;
    return this.getChunk(x >> 4, z >> 4).getTile(x & 15, y, z & 15);
  }
  // VERIFIED Level.cpp:843-869

  generate() {

    for (let cx = 0; cx < 16; cx++) {
      for (let cz = 0; cz < 16; cz++) {
        this.generateChunk(cx, cz);
      }
    }

  // VERIFIED RandomLevelSource::prepareHeights + buildSurfaces (Entry 13)
  generateChunk(cx, cz) {
    const chunk = this.level.getChunk(cx, cz);
    const xo = cx * 16, zo = cz * 16;
    // VERIFIED 5x17x5 control grid (4x4 cells with 1-cell overlap)
    const heights = new Float32Array(5 * 17 * 5);
    for (let ix = 0; ix < 5; ix++)
      for (let iy = 0; iy < 17; iy++)
        for (let iz = 0; iz < 5; iz++) {

          const wz = (zo + iz * 4) * 0.0125;

            v = v * (1 - slide) + -10 * slide;
          }
          heights[(ix * 5 + iz) * 17 + iy] = v;
        }
    // VERIFIED trilinear fill — 4×4×16 cells, each 4×4×8 blocks
    for (let bx = 0; bx < 4; bx++)
      for (let bz = 0; bz < 4; bz++)
        for (let by = 0; by < 16; by++) {
          const s0 = heights[((bx + 0) * 5 + (bz + 0)) * 17 + (by + 0)];
          const s1 = heights[((bx + 0) * 5 + (bz + 1)) * 17 + (by + 0)];
          const s2 = heights[((bx + 1) * 5 + (bz + 0)) * 17 + (by + 0)];
          const s3 = heights[((bx + 1) * 5 + (bz + 1)) * 17 + (by + 0)];
          const s0a = heights[((bx + 0) * 5 + (bz + 0)) * 17 + (by + 1)] - s0;
          const s1a = heights[((bx + 0) * 5 + (bz + 1)) * 17 + (by + 1)] - s1;
          const s2a = heights[((bx + 1) * 5 + (bz + 0)) * 17 + (by + 1)] - s2;
          const s3a = heights[((bx + 1) * 5 + (bz + 1)) * 17 + (by + 1)] - s3;

            const fy = y / 8;
            let _s0 = s0 + s0a * fy;

              let vala = (_s1 - _s0) / 4 + ((_s3 - _s2) - (_s1 - _s0)) * fx * 0.25;
              for (let z = 0; z < 4; z++) {
                const fz = z / 4;
                let v = val + vala * fz * 4;
                const yy = by * 8 + y;
                const wx = bx * 4 + x;
                const wz = bz * 4 + z;

              }

      const x = xo + this.random.nextInt(16) + 8;
      const z = zo + this.random.nextInt(16) + 8;

  scatterOre(x, y, z, oreId, size) {

    const rx = this.random.nextInt(2) + 1;
    const ry = this.random.nextInt(2) + 1;

      for (let dy = -ry; dy <= ry && placed < size; dy++)

          const wx = x + dx, wy = y + dy, wz = z + dz;
          if (!this.level.inRange(wx, wy, wz)) continue;
          if (this.level.getTile(wx, wy, wz) === 1) {

        }

  // VERIFIED TreeFeature::place — simplified (oak tree 4-6 trunk + leaves)
  placeTree(x, y, z) {
    if (this.level.getTile(x, y - 1, z) !== 2) return; // grass only
    const h = 4 + this.random.nextInt(3); // 4..6
    for (let i = 0; i < h; i++) {

        this.level.setTileNoUpdate(x, y + i, z, 17); // log

    for (let dy = -2; dy <= 1; dy++) {

          if (!this.level.inRange(lx, ly, lz)) continue;
          if (this.level.getTile(lx, ly, lz) === 0)

  // Simple value noise — UNVERIFIED (rujukan uses 8-octave Perlin)
  noise(x, y, z) {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;
    const s = this.hash(ix, iy, iz);
    const t = this.hash(ix + 1, iy, iz);
    const u = this.hash(ix, iy + 1, iz);
    const v = this.hash(ix + 1, iy + 1, iz);
    const a = this.lerp(s, t, fx);
    const b = this.lerp(u, v, fx);

/* =====================================================================
 * SECTION: client/player/LocalPlayer
 * rujukan LocalPlayer.cpp — VERIFIED Entry 6:
 *   aiStep: decrement triggers; tick input; double-jump fly 7-tick window
 *           (mayfly only); using-item damping 0.35; Mob::aiStep first then
 *           Player::aiStep.
 *   move: flying path (noPhysics, calculateFlight) OR autojump heuristic.
 *   updateAi: xxa=input.xa, yya=input.ya, jumping=input.jumping||autoJumpTime>0.
 * ===================================================================== */
class LocalPlayer extends Player {
  constructor(minecraft, level, isCreative) {
    super(level, isCreative);
    this.minecraft = minecraft;
    this.input = null;
    this.autoJumpEnabled = true; // VERIFIED LocalPlayer.cpp:956
    this.jumpTriggerTime = 0; // VERIFIED double-jump fly toggle window
    this.ascendTriggerTime = 0;
    this.descendTriggerTime = 0;
    this.ascending = false;
    this.descending = false;
    this.flyX = 0; this.flyY = 0; this.flyZ = 0;
    this.autoJumpTime = 0;
    this.sentInventoryItemId = -1;
    this.sentInventoryItemData = -1;

  // VERIFIED LocalPlayer.cpp:1135-1204 — aiStep (THE critical one)
  aiStep() {
    // 1. Decrement all trigger timers
    this.jumpTriggerTime--;
    this.ascendTriggerTime--;
    this.descendTriggerTime--;
    // 2. Save previous jumping
    const wasJumping = this.input ? this.input.jumping : false;
    // 3. If no screen covers, tick input
    const screenCovering = this.minecraft.screen && !this.minecraft.screen.passEvents;
    if (!screenCovering && this.input) this.input.tick(this);
    // 4. Sneak eye-height offset
    if (this.input && this.input.sneaking) {
      if (this.ySlideOffset < 0.2) this.ySlideOffset = 0.2;
    }
    // 5. VERIFIED double-jump fly toggle (mayfly only)
    if (this.abilities.mayfly) {
      if (!wasJumping && this.input.jumping) {
        if (this.jumpTriggerTime <= 0) this.jumpTriggerTime = 7; // 7-tick window
        else {
          this.abilities.flying = !this.abilities.flying;
          this.jumpTriggerTime = 0;
        }
      }
      // 6. VERIFIED vertical fly impulse ±0.15 per tick
      if (this.abilities.flying) {
        if (this.input.wantUp) this.yd += 0.15;
        if (this.input.wantDown) this.yd -= 0.15;
      }

      this.input.xa *= k;
      this.input.ya *= k;

  // VERIFIED LocalPlayer.cpp:1214-1264 — move (flying + autojump)
  move(xa, ya, za) {

      // FLYING PATH
      this.noPhysics = true;
      const tmp = this.walkDist;
      this.calculateFlight(xa, ya, za);
      this.fallDistance = 0;
      this.yd = 0;
      Entity.prototype.move.call(this, this.flyX, this.flyY, this.flyZ);
      this.onGround = true;
      this.walkDist = tmp;
    } else {
      // AUTOJUMP PATH
      if (this.autoJumpTime > 0) {
        this.autoJumpTime--;
        if (this.input) this.input.jumping = true;
      }
      const prevX = this.x, prevZ = this.z;
      Entity.prototype.move.call(this, xa, ya, za);
      const newX = this.x, newZ = this.z;
      // VERIFIED autojump heuristic — half-tile trigger + look-ahead + isJumpable
      if (this.autoJumpTime <= 0 && this.autoJumpEnabled) {
        let jump = false;
        if (Math.floor(prevX * 2) !== Math.floor(newX * 2) ||
            Math.floor(prevZ * 2) !== Math.floor(newZ * 2)) {
          const dist = Math.sqrt(xa * xa + za * za);
          if (dist > 0) {
            const xx = Math.floor(this.x + xa / dist);
            const zz = Math.floor(this.z + za / dist);
            const tileId = this.level.getTile(xx, Math.floor(this.y - 1), zz);
            jump = this.isSolidTile(xx, Math.floor(this.y - 1), zz) &&
                   !this.isSolidTile(xx, Math.floor(this.y), zz) &&
                   !this.isSolidTile(xx, Math.floor(this.y + 1), zz) &&
                   this.isJumpable(tileId);

        if (jump) this.autoJumpTime = 1;

  // VERIFIED LocalPlayer.cpp:71-88 — calculateFlight
  // Per MODLOG: xa = xa * flySpeed; ya = ±0.2 * flySpeed (vertical via KEY_E/Q);
  // flyX = 10 * smoothFlyX.getNewDeltaValue(xa, 0.35*sensitivity). The SmoothFloat
  // emits a small per-tick deltaValue (targetValue += deltaValue; deltaValue =
  // (target - remaining) * accel; remaining += deltaValue; return deltaValue).
  // For our browser port we approximate SmoothFloat by lerping remainingValue
  // toward targetValue with factor accelerationAmount each call.
  calculateFlight(xa, ya, za) {
    xa = xa * this.minecraft.options.flySpeed;
    za = za * this.minecraft.options.flySpeed;
    ya = 0;
    // VERIFIED KEY_E/Q vertical — UNVERIFIED exact browser mapping; use Space/Ctrl via wantUp/wantDown
    if (this.input && this.input.wantUp) ya = 0.2 * this.minecraft.options.flySpeed;
    if (this.input && this.input.wantDown) ya = -0.2 * this.minecraft.options.flySpeed;
    const accel = 0.35 * 0.5; // 0.35 * sensitivity (sensitivity default 0.5)
    // SmoothFloat approximation: lerp remaining toward target by accel, return delta
    this._smoothFlyXT = (this._smoothFlyXT || 0) + xa;
    this._smoothFlyYT = (this._smoothFlyYT || 0) + ya;
    this._smoothFlyZT = (this._smoothFlyZT || 0) + za;
    this._smoothFlyXR = this._smoothFlyXR || 0;
    this._smoothFlyYR = this._smoothFlyYR || 0;
    this._smoothFlyZR = this._smoothFlyZR || 0;
    let dx = (this._smoothFlyXT - this._smoothFlyXR) * accel;
    let dy = (this._smoothFlyYT - this._smoothFlyYR) * accel;
    let dz = (this._smoothFlyZT - this._smoothFlyZR) * accel;
    this._smoothFlyXR += dx;
    this._smoothFlyYR += dy;
    this._smoothFlyZR += dz;
    // VERIFIED: flyX = 10 * deltaValue
    this.flyX = 10 * dx;
    this.flyY = 10 * dy;
    this.flyZ = 10 * dz;
  }
  // VERIFIED LocalPlayer.cpp:274-282 — updateAi
  updateAi() {
    super.updateAi(); // Player::updateAi = updateAttackAnim
    if (!this.input) return;
    this.xxa = this.input.xa;
    this.yya = this.input.ya;
    this.jumping = this.input.jumping || this.autoJumpTime > 0;
  }
  // VERIFIED LocalPlayer.cpp:1006-1011 — isSolidTile
  isSolidTile(x, y, z) {
    const id = this.level.getTile(x, y, z);
    return id > 0 && Tile.tiles[id] && Tile.tiles[id].material.isSolidMethod();
  }
  // VERIFIED LocalPlayer.cpp:36-44 — isJumpable
  isJumpable(tileId) {
    if (!Tile.tiles[tileId]) return true;
    return Tile.tiles[tileId].renderShape !== TileShape.STAIRS &&
           Tile.tiles[tileId].renderShape !== TileShape.FENCE &&
           Tile.tiles[tileId].renderShape !== TileShape.FENCE_GATE;
  }
  isSneaking() { return this.input ? this.input.sneaking : false; }
  getFieldOfViewModifier() { return 1.0; } // VERIFIED LocalPlayer.cpp:295-312 — simplified
  causeFallDamage(d) {
    const dmg = Math.ceil(d - 3);
    if (dmg > 0) this.health = Math.max(0, this.health - dmg);
  }
}

  static get KEY_RIGHT() { return 3; }
  static get KEY_JUMP() { return 4; }
  static get KEY_SNEAK() { return 5; }
  static get KEY_CRAFT() { return 6; }
  setKey(key, state) {
    const o = this.options;
    if (key === o.keyUp.key)    this.keys[KeyboardInput.KEY_UP] = state;
    if (key === o.keyDown.key)  this.keys[KeyboardInput.KEY_DOWN] = state;
    if (key === o.keyLeft.key)  this.keys[KeyboardInput.KEY_LEFT] = state;
    if (key === o.keyRight.key) this.keys[KeyboardInput.KEY_RIGHT] = state;
    if (key === o.keyJump.key)  this.keys[KeyboardInput.KEY_JUMP] = state;
    if (key === o.keySneak.key) this.keys[KeyboardInput.KEY_SNEAK] = state;
    if (key === o.keyCraft.key) this.keys[KeyboardInput.KEY_CRAFT] = state;
  }
  releaseAllKeys() {
    this.xa = 0; this.ya = 0;
    for (let i = 0; i < this.keys.length; i++) this.keys[i] = false;
    this.wantUp = this.wantDown = false;
  }
  // VERIFIED KeyboardInput::tick — forward=+1, back=-1, left=+1, right=-1, sneak *=0.3
  tick(player) {
    this.xa = 0; this.ya = 0;
    if (this.keys[KeyboardInput.KEY_UP])    this.ya += 1; // forward +1
    if (this.keys[KeyboardInput.KEY_DOWN])  this.ya -= 1; // back -1
    if (this.keys[KeyboardInput.KEY_LEFT])   this.xa += 1; // left +1
    if (this.keys[KeyboardInput.KEY_RIGHT])  this.xa -= 1; // right -1
    this.jumping = this.keys[KeyboardInput.KEY_JUMP];
    this.sneaking = this.keys[KeyboardInput.KEY_SNEAK];
    if (this.sneaking) {
      this.xa *= 0.3;
      this.ya *= 0.3;
    }
    // fly vertical from Space/Ctrl via wantUp/wantDown
    this.wantUp = this.keys[KeyboardInput.KEY_JUMP] && player && player.abilities && player.abilities.flying;
    this.wantDown = this.sneaking && player && player.abilities && player.abilities.flying;
  }
}

    this.accumDX = 0; this.accumDY = 0;

    this.accumDX += dx;
    this.accumDY += dy;
  }

  static linearTransform(value, deadZone, scale = 1, limit1 = false) {
    const deadSigned = value >= 0 ? deadZone : -deadZone;

    if (limit1 && Math.abs(ret) > 1) ret /= Math.abs(ret);
    return ret;
  }
}

/* =====================================================================
 * SECTION: client/gui/GuiComponent + Font
 * rujukan GuiComponent + Font — minimal CSS-based rendering (no GL tesselator).
 * ===================================================================== */
class Font {
  constructor() {
    this.loaded = false;
    this.height = 8;
    this.canvas = null;
    this.ctx = null;
    this._ready = false;
    this._initCanvas();
  }
  _initCanvas() {
    // Use HTML @font-face — width measured via canvas
    this.canvas = document.createElement('canvas');
    this.canvas.width = 256; this.canvas.height = 32;
    this.ctx = this.canvas.getContext('2d');
    this.ctx.font = '12px "Minecraft Ten"';
    this._ready = true;
  }
  width(str) {
    if (!this._ready) this._initCanvas();
    this.ctx.font = '12px "Minecraft Ten"';
    return Math.ceil(this.ctx.measureText(str || '').width);
  }
  draw(ctx, str, x, y, color = 0xffffffff) {
    ctx.font = '12px "Minecraft Ten"';
    ctx.textBaseline = 'top';
    const r = (color >>> 0) & 0xff;
    const g = (color >>> 8) & 0xff;
    const b = (color >>> 16) & 0xff;
    const a = ((color >>> 24) & 0xff) / 255;
    ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    ctx.shadowColor = 'rgba(0,0,0,1)';
    ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;
    ctx.fillText(str, x, y);
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  }
  drawCentered(ctx, str, x, y, color) {
    const w = this.width(str);
    this.draw(ctx, str, x - w / 2, y, color);
  }
}

class GuiComponent {
  constructor() {}
  // VERIFIED GuiComponent::blit / drawString / drawCenteredString / fill
  drawString(font, str, x, y, color) { font.draw(this._ctx || window._guiCtx, str, x, y, color); }
  drawCenteredString(font, str, x, y, color) { font.drawCentered(this._ctx || window._guiCtx, str, x, y, color); }
}


/* =====================================================================
 * SECTION: client/gui/components/Button
 * rujukan Button.cpp — default 200×24, yImage 0/1/2 for inactive/normal/hover,
 * text colors 0xffa0a0a0 inactive / 0xe0e0e0 normal / 0xffffa0 hover,
 * y_offset = 46 + yImage*20.
 * ===================================================================== */
class Button extends GuiComponent {
  constructor(id, x, y, w, h, msg) {
    super();
    if (msg === undefined) {
      // (id, msg) or (id, x, y, msg) overloads
      if (h === undefined) {
        // (id, x, y, msg)
        msg = w; w = 200; h = 24;
      } else {
        // (id, msg)
        msg = x; x = 0; y = 0; w = 200; h = 24;
      }
    }
    this.id = id;
    this.x = x; this.y = y;
    this.width = w; this.height = h;
    this.msg = msg;
    this.active = true;
    this.visible = true;
    this.selected = false;
    this._currentlyDown = false;
  }
  // VERIFIED Button.cpp:67-74 — getYImage
  getYImage(hovered) {
    if (!this.active) return 0;
    if (hovered) return 2;
    return 1;
  }
  // VERIFIED Button.cpp:9730-9733 — clicked hit-test
  clicked(mx, my) {
    return this.active && mx >= this.x && my >= this.y &&
           mx < this.x + this.width && my < this.y + this.height;
  }
  isInside(mx, my) {
    return mx >= this.x && my >= this.y &&
           mx < this.x + this.width && my < this.y + this.height;
  }
  hovered(mx, my) { return this._currentlyDown && this.isInside(mx, my); }
  setPressed() { this._currentlyDown = true; }
  released(mx, my) { this._currentlyDown = false; }
  // Render via DOM — VERIFIED colors & text offset (y + (height-8)/2)
  render(ctx, font, mx, my) {
    if (!this.visible) return;
    const yImage = this.getYImage(this.selected || this.hovered(mx, my));
    const bgY = 46 + yImage * 20;
    // Background — simulate gui.png 200×20 slice with two halves
    const colors = ['rgba(160,160,160,0.85)', 'rgba(120,120,120,0.85)', 'rgba(160,160,80,0.85)'];
    ctx.fillStyle = colors[yImage];
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.strokeStyle = 'rgba(40,40,40,1)';
    ctx.lineWidth = 1;
    ctx.strokeRect(this.x + 0.5, this.y + 0.5, this.width - 1, this.height - 1);
    // Text color: VERIFIED 0xffa0a0a0 / 0xe0e0e0 / 0xffffa0
    let textColor;
    if (!this.active) textColor = 0xffa0a0a0;
    else if (this.hovered(mx, my) || this.selected) textColor = 0xffffa0;
    else textColor = 0xe0e0e0;
    // text Y offset = y + (height-8)/2 — VERIFIED
    font.drawCentered(ctx, this.msg, this.x + this.width / 2, this.y + (this.height - 8) / 2, textColor);
  }
}


/* =====================================================================
 * SECTION: client/gui/Screen
 * rujukan Screen.cpp — VERIFIED lifecycle:
 *   init(minecraft,w,h) → init() → setupPositions() → updateTabButtonSelection()
 *   mouseClicked → hit-test buttons → setPressed → record clickedButton
 *   mouseReleased → buttonClicked(button) + sound, release
 *   keyPressed ESC → setScreen(null)
 * ===================================================================== */
class Screen extends GuiComponent {
  constructor() {
    super();
    this.passEvents = false;
    this.clickedButton = null;
    this.tabButtonIndex = 0;
    this.width = 1; this.height = 1;
    this.minecraft = null;
    this.font = null;
    this.buttons = [];
    this.tabButtons = [];
    this.textBoxes = [];
  }
  // VERIFIED Screen.cpp:30-44 — lifecycle
  initScreen(minecraft, width, height) {
    this.minecraft = minecraft;
    this.font = minecraft.font;
    this.width = width; this.height = height;
    this.init();        // subclass adds buttons
    this.setupPositions();
    this.updateTabButtonSelection();
  }
  init() {} // virtual
  setupPositions() {} // virtual
  setSize(w, h) { this.width = w; this.height = h; this.setupPositions(); }
  // VERIFIED Screen.cpp:22-28 — base render iterates buttons
  render(ctx, xm, ym, a) {
    for (const b of this.buttons) b.render(ctx, this.font, xm, ym);
  }
  // VERIFIED Screen.cpp:193-234 — mouseClicked
  mouseClicked(x, y, buttonNum) {
    if (buttonNum === 0) { // ACTION_LEFT
      for (const b of this.buttons) {
        if (b.clicked(this.minecraft, x, y)) {
          b.setPressed();
          this.clickedButton = b;
        }
      }
    }
  }
  // VERIFIED Screen.cpp:193-234 — mouseReleased
  mouseReleased(x, y, buttonNum) {
    if (!this.clickedButton || buttonNum !== 0) return;
    for (const b of this.buttons) {
      if (this.clickedButton === b && b.clicked(this.minecraft, x, y)) {
        this.buttonClicked(b);
        this.minecraft.soundEngine && this.minecraft.soundEngine.playUI('random.click', 1, 1);
        b.released(x, y);
      }
    }
    this.clickedButton = null;
  }
  // VERIFIED Screen.cpp:154-182 — keyPressed ESC closes screen
  keyPressed(key) {
    if (key === 27 /* ESC */) {
      this.minecraft.setScreen(null);
      return;
    }
    // Tab-button navigation — VERIFIED keyMenuNext/Previous/Ok
    if (this.minecraft.useTouchscreen && this.minecraft.useTouchscreen()) return;
    if (this.tabButtons.length === 0) return;
    const o = this.minecraft.options;
    if (key === o.keyMenuNext.key) {
      if (++this.tabButtonIndex === this.tabButtons.length) this.tabButtonIndex = 0;
    }
    if (key === o.keyMenuPrevious.key) {
      if (--this.tabButtonIndex < 0) this.tabButtonIndex = this.tabButtons.length - 1;
    }
    if (key === o.keyMenuOk.key) {
      const b = this.tabButtons[this.tabButtonIndex];
      if (b.active) {
        this.minecraft.soundEngine && this.minecraft.soundEngine.playUI('random.click', 1, 1);
        this.buttonClicked(b);
      }
    }
    this.updateTabButtonSelection();
  }
  updateTabButtonSelection() {
    if (this.minecraft && this.minecraft.useTouchscreen && this.minecraft.useTouchscreen()) return;
    for (let i = 0; i < this.tabButtons.length; i++) {
      this.tabButtons[i].selected = (i === this.tabButtonIndex);
    }
  }
  buttonClicked(button) {} // virtual
  // VERIFIED Screen.cpp:135-243 — defaults
  tick() {}
  isPauseScreen() { return true; }
  isErrorScreen() { return false; }
  isInGameScreen() { return true; }
  closeOnPlayerHurt() { return false; }
  renderGameBehind() { return true; }
  hasClippingArea(out) { return false; }
  handleBackEvent(isDown) { return false; }
  // VERIFIED Screen.cpp:103-133 — renderBackground
  renderBackground(ctx) {
    if (this.minecraft.isLevelGenerated && this.minecraft.level) {
      ctx.fillStyle = 'rgba(16,16,16,0.75)';
      ctx.fillRect(0, 0, this.width, this.height);
    } else {
      this.renderDirtBackground(ctx, 0);
    }
  }
  renderDirtBackground(ctx, vo) {
    ctx.fillStyle = '#404040'; // VERIFIED Screen.cpp:127 — 0x404040 tint
    ctx.fillRect(0, 0, this.width, this.height);
  }
}

/* =====================================================================
 * SECTION: client/gui/Gui
 * rujukan Gui — HUD: renderToolBar (9-slot hotbar), renderHearts (10 hearts
 * for MAX_HEALTH=20 survival), renderBubbles (in water), crosshair,
 * debug overlay.
 * ===================================================================== */
class Gui extends GuiComponent {
  constructor(minecraft) {
    super();
    this.minecraft = minecraft;
    this.progress = 0; // destroy progress (crosshair ring)
    this.selectedItemName = '';
    this.selectedItemNameTime = 0;
    this.chat = [];
    this.flashTime = 0;
  }
  tick() {
    if (this.flashTime > 0) this.flashTime--;
    if (this.selectedItemNameTime > 0) this.selectedItemNameTime--;
  }
  // Render the HUD via DOM overlay — separate from 3D scene
  renderHUD() {
    const hud = document.getElementById('hud');
    if (!hud) return;
    const p = this.minecraft.player;
    if (!p) return;
    // XYZ + mode + time + fps
    const mode = this.minecraft.isCreativeMode() ? 'Creative' : 'Survival';
    const tod = this.minecraft.level.getTimeOfDay();
    const health = Math.max(0, p.health);
    const lines = [
      `VoxelCraft  MCPE 2013 faithful port`,
      `XYZ ${p.x.toFixed(1)} ${p.y.toFixed(1)} ${p.z.toFixed(1)}`,
      `Health ${health}/${Player.MAX_HEALTH}  Mode ${mode}  Time ${tod}/${LevelConstants.TICKS_PER_DAY}`,
      `Selected ${p.inventory.getSelected() ? p.inventory.getSelected().id : '-'}  Fly ${p.abilities.flying}  FPS ${this.minecraft.fps|0}`,
    ];
    hud.textContent = lines.join('\n');
    // Hearts (survival only)
    this.renderHearts();
    // Hotbar
    this.renderHotbar();
  }
  renderHearts() {
    const div = document.getElementById('hearts');
    if (!div) return;
    const p = this.minecraft.player;
    if (!p) { div.innerHTML = ''; return; }
    // Only survival shows hearts
    if (this.minecraft.isCreativeMode()) { div.innerHTML = ''; return; }
    const total = Math.ceil(Player.MAX_HEALTH / 2);
    let html = '';
    for (let i = 0; i < total; i++) {
      const h = Math.max(0, Math.min(2, p.health - i * 2));
      html += `<canvas class="heart" data-h="${h}"></canvas>`;
    }
    if (div.innerHTML !== html) {
      div.innerHTML = html;
      for (const c of div.querySelectorAll('canvas')) {
        c.width = 11; c.height = 11;
        const ctx = c.getContext('2d');
        const h = +c.dataset.h;
        ctx.fillStyle = h === 0 ? '#222' : '#e00';
        ctx.fillRect(2, 2, 9, 8);
        if (h === 1) { ctx.fillStyle = '#222'; ctx.fillRect(7, 2, 4, 8); }
      }
    } else {
      // Update colors
      for (const c of div.querySelectorAll('canvas')) {
        const ctx = c.getContext('2d');
        const h = +c.dataset.h;
        ctx.clearRect(0, 0, 11, 11);
        ctx.fillStyle = h === 0 ? '#222' : '#e00';
        ctx.fillRect(2, 2, 9, 8);
        if (h === 1) { ctx.fillStyle = '#222'; ctx.fillRect(7, 2, 4, 8); }
      }
    }
  }
  renderHotbar() {
    const div = document.getElementById('hotbar');
    if (!div) return;
    const inv = this.minecraft.player.inventory;
    let html = '';
    for (let i = 0; i < 9; i++) {
      const it = inv.items[i];
      const sel = i === inv.selected ? ' sel' : '';
      const ct = it && it.count > 1 ? `<span class="ct">${it.count}</span>` : '';
      const tex = it && it.id > 0 ? this._slotTextureName(it.id) : '';
      html += `<div class="hslot${sel}" data-i="${i}"><canvas data-tex="${tex}"></canvas>${ct}</div>`;
    }
    if (div.innerHTML !== html) {
      div.innerHTML = html;
      for (const c of div.querySelectorAll('.hslot')) {
        c.addEventListener('click', () => {
          inv.selectSlot(+c.dataset.i);
        });
      }
      for (const c of div.querySelectorAll('canvas')) {
        c.width = 18; c.height = 18;
        this._paintSlot(c);
      }
    } else {
      // Refresh selection
      const slots = div.querySelectorAll('.hslot');
      for (let i = 0; i < slots.length; i++) {
        slots[i].className = 'hslot' + (i === inv.selected ? ' sel' : '');
      }
    }
  }
  _slotTextureName(id) {
    if (id < 256) return null;

/* =====================================================================
 * SECTION: client/Timer
 * rujukan Timer.h — VERIFIED Entry 18.2:
 *   ticksPerSecond = 20, MAX_TICKS_PER_UPDATE = 10, advanceTime computes
 *   ticks + a (alpha interpolation factor).
 * ===================================================================== */
class Timer {
  constructor(ticksPerSecond = 20) {
    this.ticksPerSecond = ticksPerSecond;
    this.MAX_TICKS_PER_UPDATE = 10;
    this.adjustTime = 1.0;
    this.timeScale = 1.0;
    this.passedTime = 0;
    this.lastMs = performance.now();
    this.lastTime = this.lastMs / 1000;
    this.ticks = 0;
    this.a = 0;
  }
  // VERIFIED Timer.cpp advanceTime
  advanceTime() {
    const nowMs = performance.now();
    let passedMs = nowMs - this.lastMs;
    if (passedMs > 1000) {
      this.adjustTime = 1.0; // reset on large gap
      this.lastMs = nowMs;
    }
    if (passedMs < 0) {
      this.lastMs = nowMs;
      passedMs = 0;
    }
    const now = nowMs / 1000;
    let passedSeconds = (now - this.lastTime) * this.adjustTime;
    this.lastTime = now;
    if (passedSeconds < 0) passedSeconds = 0;
    if (passedSeconds > 1) passedSeconds = 1; // clamp 1 sec max
    this.passedTime += passedSeconds * this.timeScale * this.ticksPerSecond;
    this.ticks = Math.floor(this.passedTime);
    this.passedTime -= this.ticks;
    if (this.ticks > this.MAX_TICKS_PER_UPDATE) this.ticks = this.MAX_TICKS_PER_UPDATE;
    this.a = this.passedTime;
  }
}

        break;
      case Facing.NORTH: // -Z
        verts = [
          [x+1, y, z], [x+1, y+1, z], [x, y+1, z], [x, y, z]

    const y = p.yOld + (p.y - p.yOld) * a + p.heightOffset;

    let html = '<div class="panel">';
    if (this.screen instanceof StartMenuScreen) {
      html += '<h1>VoxelCraft</h1>';
      for (const b of this.screen.buttons) {
        html += `<button data-id="${b.id}"${b.active ? '' : ' class="disabled" disabled'}>${b.msg}</button>`;
      }
    } else if (this.screen instanceof PauseScreen) {
      html += '<h1>Game menu</h1>';
      for (const b of this.screen.buttons) {
        html += `<button data-id="${b.id}">${b.msg}</button>`;
      }
    }
    html += '</div>';
    overlay.innerHTML = html;
    // Wire button click → screen.buttonClicked
    const btns = overlay.querySelectorAll('button');
    for (const btn of btns) {
      btn.addEventListener('click', () => {
        const id = +btn.dataset.id;
        for (const b of this.screen.buttons) {
          if (b.id === id && b.active) {
            this.screen.buttonClicked(b);
            this.soundEngine.playUI('random.click', 1, 1);
            // Refresh overlay (button label / state may have changed)
            if (this.screen) this._updateOverlay();
            return;
          }
        }
      });
    }
  }
  // VERIFIED Minecraft.cpp:508-602 — tick (per-tick driver)
  tick(nTick, maxTick) {
    if (this.missTime > 0) this.missTime--;
    // gameMode.tick
    if (this.level && this.gameMode) this.gameMode.tick();
    // tickInput
    this.tickInput();
    // gui.tick
    this.gui.tick();
    if (this.level) {
      // gameRenderer.tick
      this.gameRenderer.tick(nTick, maxTick);
      // levelRenderer.tick
      this.levelRenderer.tick();
      // level.tickEntities
      this.level.tickEntities();
      // level.tick
      this.level.tick();
      // particleEngine.tick
      this.particleEngine.tick();
      // update dirty chunks after physics
      this.levelRenderer.updateDirtyChunks(this.player);
    }
    // screen.tick
    if (this.screen) {
      this._screenMutex = true;
      this.screen.tick();
      this._screenMutex = false;
      if (this._scheduledScreen) {
        const s = this._scheduledScreen;
        this._scheduledScreen = null;
        this.setScreen(s);
      }
    }
  }
  // VERIFIED Minecraft.cpp:614-915 — tickInput (simplified)
  tickInput() {
    if (this.screen && !this.screen.passEvents) {
      // Screen consumes all input — DOM overlay handles clicks
      return;
    }
    if (!this.player) return;
    // Build input polling
    const bai = new BuildActionIntention();
    const handled = this.buildInput.tickBuild(this.player, bai);
    if (handled && !bai.isRemoveContinue()) {
      this.handleBuildAction(bai);
    }
    // Left mouse held → continueDestroyBlock; right → use
    const leftHeld = this.buildInput.leftDown;
    if (this.hitResult && this.hitResult.isHit() && this.hitResult.type === HitResult.TILE) {
      if (leftHeld && !this.hitResult.indirectHit) {
        const { x, y, z, f } = this.hitResult;
        this.gameMode.continueDestroyBlock(x, y, z, f);
        this.particleEngine.crack(x, y, z, f);
        this.player.swing();
      } else if (!leftHeld) {
        this.gameMode.stopDestroyBlock();
      }
    } else if (!leftHeld) {
      this.gameMode.stopDestroyBlock();
    }
  }
  // VERIFIED Minecraft.cpp:953-1031 — handleBuildAction
  handleBuildAction(action) {
    if (action.isRemove()) {
      if (this.missTime > 0) return;
      this.player.swing();
    }
    if (this.player.isUsingItem()) return;
    if (!this.hitResult.isHit()) {
      if (action.isRemove() && !this.gameMode.isCreativeType()) {
        this.missTime = 10;
      }
      return;
    }
    if (this.hitResult.type === HitResult.TILE) {
      const { x, y, z, f, pos } = this.hitResult;
      if (action.isRemove()) {
        this.gameMode.startDestroyBlock(x, y, z, f);
      } else {
        const item = this.player.inventory.getSelected();
        if (this.gameMode.useItemOn(this.player, this.level, item, x, y, z, f, pos)) {
          this.player.swing();
          this.levelRenderer.tileChanged(x, y, z);
        }
        if (item && item.count <= 0) {
          this.player.inventory.clearSlot(this.player.inventory.selected);
        }
      }
    }
  }
  // Browser input listeners — keyboard, mouse, wheel, pointer lock
  _installInputListeners() {
    window.addEventListener('keydown', (e) => {
      if (this.screen && !this.screen.passEvents) {
        // forward ESC only
        if (e.keyCode === 27) this.screen.keyPressed(27);
        return;
      }
      this.input.setKey(e.keyCode, true);
      // Hotbar digits 1-9
      if (e.keyCode >= 49 && e.keyCode <= 57) {
        this.gui.handleKeyPressed(e.keyCode);
      }
      if (e.keyCode === 27) {
        if (this.level) this.pauseGame(false);
      }
      if (e.keyCode === 69 && this.level) { // E — toggle creative/survival
        this.setIsCreativeMode(!this.isCreative);
      }
      if (e.keyCode === 80 && this.level) { // P — pause (alt keybind per Minecraft.cpp)
        this.pauseGame(false);
      }
    });
    window.addEventListener('keyup', (e) => {
      this.input.setKey(e.keyCode, false);
    });
    document.addEventListener('mousemove', (e) => {
      if (this.mouseGrabbed) {
        this.mouseHandler.feed(e.movementX, e.movementY);
      }
    });
    document.addEventListener('mousedown', (e) => {
      if (this.screen) return; // screen handles clicks via overlay
      if (e.button === 0) this.buildInput.leftDown = true;
      if (e.button === 2) this.buildInput.rightDown = true;
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 0) this.buildInput.leftDown = false;
      if (e.button === 2) this.buildInput.rightDown = false;
    });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => {
      if (this.screen) return;
      const inv = this.player.inventory;
      const dir = Math.sign(e.deltaY);
      const newSel = (inv.selected + dir + 9) % 9;
      inv.selectSlot(newSel);
    });
    window.addEventListener('resize', () => {
      this.width = window.innerWidth;
      this.height = window.innerHeight;
      this.renderer.setSize(this.width, this.height);
      this.camera.aspect = this.width / this.height;
      this.camera.updateProjectionMatrix();
    });
  }
  _loop(now) {
    if (!this._running) return;
    // FPS counter
    this._frameCount++;
    this._fpsTimer += now - this._lastFrame;
    if (this._fpsTimer > 1000) {
      this.fps = this._frameCount;
      this._frameCount = 0;
      this._fpsTimer = 0;
    }
    this._lastFrame = now;
    this.update();
    requestAnimationFrame(this._loop.bind(this));
  }
}

window.addEventListener('load', () => {
  const mc = new Minecraft();
  window.mc = mc;
  mc.init();
  // Hide loading screen after init
  setTimeout(() => {
    const loading = document.getElementById('loading');
    if (loading) loading.classList.add('hidden');
  }, 100);
});

  KeyboardInput, MouseTurnInput, MouseBuildInput, Item, ItemInstance,
  Inventory, GameMode, SurvivalMode, CreativeMode, Screen, Button,

};
