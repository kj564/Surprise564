<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VoxelCraft — Rujukan Faithful Port</title>
  <style>
    /* ============================================================
     * GuiComponent drawing primitives — minimal CSS mirroring rujukan's
     * GuiComponent::blit / fill / drawString. No modern polish.
     * (rujukan has no clouds, no vignette, no sprint FOV kick.)
     * ============================================================ */
    @font-face {
      font-family: 'Minecraft Ten';
      src: url('./VoxelCraft/font/minecraft-ten.ttf') format('truetype');
      font-display: swap;
    }
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #88c5ff;
      font-family: 'Minecraft Ten', 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      color: #fff;
    }
    #game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }

    /* Crosshair — Gui::renderProgressIndicator crosshair sprite */
    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 22px; height: 22px; pointer-events: none; z-index: 5;
      mix-blend-mode: difference;
    }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

    /* Hotbar — Gui::renderToolBar mirrors 9-slot hotbar from Inventory::MAX_SELECTION_SIZE */
    #hotbar {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      display: flex; gap: 1px; padding: 0; z-index: 5;
      background: transparent;
    }
    .hslot {
      width: 24px; height: 24px; position: relative; cursor: pointer;
      background: rgba(20,20,20,0.55);
      display: flex; align-items: center; justify-content: center;
      image-rendering: pixelated;
    }
    .hslot.sel { background: rgba(255,255,255,0.0); outline: 2px solid #fff; }
    .hslot canvas { width: 18px; height: 18px; image-rendering: pixelated; }
    .hslot .ct { position: absolute; bottom: 1px; right: 2px; font-size: 10px;
      color: #fff; text-shadow: 1px 1px 0 #000; }

    /* HUD: hearts + bubbles + debug text */
    #hud-top {
      position: fixed; top: 6px; left: 6px; z-index: 5;
      font-size: 12px; line-height: 1.4; text-shadow: 1px 1px 0 #000;
      background: rgba(0,0,0,0.30); padding: 4px 8px; color: #fff;
      font-variant-numeric: tabular-nums; pointer-events: none;
    }
    #hud-top b { color: #ffe082; }
    #hearts {
      position: fixed; left: 8px; bottom: 44px; z-index: 5;
      display: flex; flex-wrap: wrap; width: 132px;
      pointer-events: none;
    }
    #hearts canvas { width: 13px; height: 13px; image-rendering: pixelated; margin: 1px; }
    #bubbles {
      position: fixed; right: 8px; bottom: 44px; z-index: 5;
      display: none; flex-direction: row; align-items: center;
      pointer-events: none;
    }
    #bubbles canvas { width: 13px; height: 13px; image-rendering: pixelated; margin: 1px; }

    /* Break progress overlay (GameMode.render publishes destroyProgress) */
    #break-progress {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 40px; height: 40px; border-radius: 50%; pointer-events: none;
      background: rgba(0,0,0,0.0); z-index: 4; display: none;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.6) inset;
    }

    /* Overlay — Screen container (StartMenuScreen / PauseScreen) */
    #overlay {
      position: fixed; inset: 0; z-index: 10; cursor: default;
      background: rgba(0,0,0,0.55);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center; padding: 24px; overflow-y: auto;
    }
    #overlay.hidden { display: none; }
    #overlay .panel { width: min(420px, 92vw); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #overlay h1 {
      font-family: 'Minecraft Ten', 'Segoe UI', system-ui, sans-serif;
      font-size: clamp(28px, 5vw, 44px); font-weight: 800; line-height: 1;
      color: #fff; text-shadow: 2px 2px 0 #222, 4px 4px 0 rgba(0,0,0,0.4);
      margin: 0; letter-spacing: 1px;
    }
    #overlay .sub { font-size: 12px; letter-spacing: 3px; color: #ccc; margin-top: 4px; }
    .mc-btn {
      font-family: 'Minecraft Ten', 'Segoe UI', sans-serif;
      font-size: 14px; padding: 8px 14px; min-width: 220px;
      color: #fff; background: #6a6a6a; border: 2px solid #000; cursor: pointer;
      box-shadow: 0 3px 0 #2a2a2a; text-shadow: 1px 1px 0 #222;
      transition: background .08s;
      image-rendering: pixelated;
    }
    .mc-btn:hover { background: #8a8a8a; }
    .mc-btn:active { background: #555; box-shadow: 0 1px 0 #2a2a2a; transform: translateY(2px); }
    .mc-btn.disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: 0 3px 0 #222; }

    /* Loading — Textures loader */
    #loading {
      position: fixed; inset: 0; z-index: 30; background: #1a1a2e;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff;
    }
    #loading.hidden { display: none; }
    .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #bfff7a; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .tip { font-size: 12px; color: #b9b9c9; }

    /* Toast — Gui::addMessage (chat-like) */
    #toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.78); color: #fff; padding: 8px 14px;
      font-size: 13px; z-index: 8; opacity: 0; transition: opacity .2s; pointer-events: none;
      text-shadow: 1px 1px 0 #000;
    }
    #toast.show { opacity: 1; }

    #splash {
      position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #888; z-index: 3; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="break-progress"></div>
  <div id="hearts"></div>
  <div id="bubbles"></div>
  <div id="hud-top"></div>
  <div id="hotbar"></div>
  <div id="toast"></div>
  <div id="splash">VoxelCraft — Rujukan Faithful Port · MCPE 2013</div>
  <div id="overlay" class="hidden"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading…</div>
    <div class="tip">VoxelCraft — Rujukan Faithful Port</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';

  /* ============================================================
   * VoxelCraft — Rujukan Faithful Port
   * A faithful browser port of historical Minecraft Pocket Edition 2013
   * C++ source (rujukan/). All class names, constants, tile IDs, tick
   * flow order, and screen lifecycle mirror the C++ originals.
   *
   * Folder layout of this <script> mirrors rujukan/ paths.
   * ============================================================ */

  /* ============================================================
   * SECTION: world/phys/Vec3
   * Mirrors: world/phys/Vec3.h
   * Pure 3-float struct with add/sub/scale/dot/length/distance.
   * ============================================================ */
  class Vec3 {
    constructor(x = 0, y = 0, z = 0) {
      // -0.0 → 0.0 normalization (rujukan ctor quirk)
      this.x = x === -0 ? 0 : x;
      this.y = y === -0 ? 0 : y;
      this.z = z === -0 ? 0 : z;
    }
    set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
    add(v) { return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z); }
    subtract(v) { return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z); }
    scale(s) { return new Vec3(this.x * s, this.y * s, this.z * s); }
    addSelf(v) { this.x += v.x; this.y += v.y; this.z += v.z; return this; }
    subSelf(v) { this.x -= v.x; this.y -= v.y; this.z -= v.z; return this; }
    dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
    cross(v) {
      return new Vec3(
        this.y * v.z - this.z * v.y,
        this.z * v.x - this.x * v.z,
        this.x * v.y - this.y * v.x
      );
    }
    length() { return Math.sqrt(this.dot(this)); }
    distanceTo(v) { return this.subtract(v).length(); }
    distanceToSqr(v) {
      const dx = this.x - v.x, dy = this.y - v.y, dz = this.z - v.z;
      return dx * dx + dy * dy + dz * dz;
    }
    normalize() {
      const l = this.length();
      if (l < 0.0001) return new Vec3(0, 0, 0);
      return new Vec3(this.x / l, this.y / l, this.z / l);
    }
    lerp(v, a) {
      return new Vec3(
        this.x + (v.x - this.x) * a,
        this.y + (v.y - this.y) * a,
        this.z + (v.z - this.z) * a
      );
    }
    copy() { return new Vec3(this.x, this.y, this.z); }
  }

  /* ============================================================
   * SECTION: world/phys/AABB
   * Mirrors: world/phys/AABB.h
   * Axis-aligned box with min/max corners. clip{X,Y,Z}Collide are
   * the sliding-collision primitives used by Entity::move.
   * ============================================================ */
  class AABB {
    constructor(x0 = 0, y0 = 0, z0 = 0, x1 = 1, y1 = 1, z1 = 1) {
      this.set(x0, y0, z0, x1, y1, z1);
    }
    set(x0, y0, z0, x1, y1, z1) {
      this.x0 = x0; this.y0 = y0; this.z0 = z0;
      this.x1 = x1; this.y1 = y1; this.z1 = z1;
      return this;
    }
    setB(b) { return this.set(b.x0, b.y0, b.z0, b.x1, b.y1, b.z1); }
    copy() { return new AABB(this.x0, this.y0, this.z0, this.x1, this.y1, this.z1); }
    cloneMove(xa, ya, za) {
      return new AABB(this.x0 + xa, this.y0 + ya, this.z0 + za,
                      this.x1 + xa, this.y1 + ya, this.z1 + za);
    }
    move(xa, ya, za) {
      this.x0 += xa; this.y0 += ya; this.z0 += za;
      this.x1 += xa; this.y1 += ya; this.z1 += za;
      return this;
    }
    // directional expand (extend only on +side if axis>0, else -side)
    expand(xa, ya, za) {
      if (xa < 0) this.x0 += xa; else this.x1 += xa;
      if (ya < 0) this.y0 += ya; else this.y1 += ya;
      if (za < 0) this.z0 += za; else this.z1 += za;
      return this;
    }
    // symmetric grow (all 6 sides)
    grow(xa, ya, za) {
      this.x0 -= xa; this.x1 += xa;
      this.y0 -= ya; this.y1 += ya;
      this.z0 -= za; this.z1 += za;
      return this;
    }
    shrink(xa, ya, za) {
      this.x0 += xa; this.x1 -= xa;
      this.y0 += ya; this.y1 -= ya;
      this.z0 += za; this.z1 -= za;
      return this;
    }
    intersects(b) {
      return this.x1 > b.x0 && this.x0 < b.x1 &&
             this.y1 > b.y0 && this.y0 < b.y1 &&
             this.z1 > b.z0 && this.z0 < b.z1;
    }
    intersectsBox(x02, y02, z02, x12, y12, z12) {
      return this.x1 > x02 && this.x0 < x12 &&
             this.y1 > y02 && this.y0 < y12 &&
             this.z1 > z02 && this.z0 < z12;
    }
    contains(v) {
      return v.x >= this.x0 && v.x < this.x1 &&
             v.y >= this.y0 && v.y < this.y1 &&
             v.z >= this.z0 && v.z < this.z1;
    }
    getSize() { return (this.x1 - this.x0 + this.y1 - this.y0 + this.z1 - this.z0) / 3; }
    // Sliding collision response: largest allowed motion along X axis
    // such that AABB c does not intersect this AABB.
    clipXCollide(c, xa) {
      if (c.y1 > this.y0 && c.y0 < this.y1 && c.z1 > this.z0 && c.z0 < this.z1) {
        if (xa > 0 && c.x1 <= this.x0) {
          const d = this.x0 - c.x1;
          if (d < xa) xa = d;
        } else if (xa < 0 && c.x0 >= this.x1) {
          const d = this.x1 - c.x0;
          if (d > xa) xa = d;
        }
      }
      return xa;
    }
    clipYCollide(c, ya) {
      if (c.x1 > this.x0 && c.x0 < this.x1 && c.z1 > this.z0 && c.z0 < this.z1) {
        if (ya > 0 && c.y1 <= this.y0) {
          const d = this.y0 - c.y1;
          if (d < ya) ya = d;
        } else if (ya < 0 && c.y0 >= this.y1) {
          const d = this.y1 - c.y0;
          if (d > ya) ya = d;
        }
      }
      return ya;
    }
    clipZCollide(c, za) {
      if (c.x1 > this.x0 && c.x0 < this.x1 && c.y1 > this.y0 && c.y0 < this.y1) {
        if (za > 0 && c.z1 <= this.z0) {
          const d = this.z0 - c.z1;
          if (d < za) za = d;
        } else if (za < 0 && c.z0 >= this.z1) {
          const d = this.z1 - c.z0;
          if (d > za) za = d;
        }
      }
      return za;
    }
    // Ray-box intersection; returns HitResult(TILE) or NO_HIT.
    clip(a, b) {
      let tmin = 0, tmax = 1;
      let face = -1;
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const o = [a.x, a.y, a.z];
      const d = [dx, dy, dz];
      const lo = [this.x0, this.y0, this.z0];
      const hi = [this.x1, this.y1, this.z1];
      for (let i = 0; i < 3; i++) {
        if (Math.abs(d[i]) < 1e-9) {
          if (o[i] < lo[i] || o[i] > hi[i]) return HitResult.NO_HIT();
        } else {
          const inv = 1 / d[i];
          let t1 = (lo[i] - o[i]) * inv;
          let t2 = (hi[i] - o[i]) * inv;
          let f1 = i === 0 ? (d[i] > 0 ? 4 : 5)
                  : i === 1 ? (d[i] > 0 ? 0 : 1)
                            : (d[i] > 0 ? 2 : 3);
          let f2 = i === 0 ? (d[i] > 0 ? 5 : 4)
                  : i === 1 ? (d[i] > 0 ? 1 : 0)
                            : (d[i] > 0 ? 3 : 2);
          if (t1 > t2) { const t = t1; t1 = t2; t2 = t; const f = f1; f1 = f2; f2 = f; }
          if (t1 > tmin) { tmin = t1; face = f1; }
          if (t2 < tmax) tmax = t2;
          if (tmin > tmax) return HitResult.NO_HIT();
        }
      }
      const hit = new Vec3(a.x + dx * tmin, a.y + dy * tmin, a.z + dz * tmin);
      return new HitResult(HitResult.TILE, 0, 0, 0, face, hit);
    }
  }

  /* ============================================================
   * SECTION: world/phys/HitResult
   * Mirrors: world/phys/HitResult.h
   * ============================================================ */
  class HitResult {
    static get TILE()    { return 0; }
    static get ENTITY()  { return 1; }
    static get NO_HIT()  { return 2; }
    constructor(type, x = 0, y = 0, z = 0, f = -1, pos = null, entity = null) {
      this.type = type;
      this.x = x; this.y = y; this.z = z;
      this.f = f;            // face 0..5 (0=DOWN,1=UP,2=NORTH,3=SOUTH,4=WEST,5=EAST)
      this.pos = pos || new Vec3();
      this.entity = entity;
      this.indirectHit = false;
    }
    static NO_HIT() { return new HitResult(HitResult.NO_HIT); }
    isHit() { return this.type !== HitResult.NO_HIT; }
  }

  /* ============================================================
   * SECTION: world/level/LevelConstants
   * Mirrors: world/level/LevelConstants.h
   * Bounded world (NOT infinite).
   * ============================================================ */
  const LevelConstants = {
    LEVEL_HEIGHT: 128,
    CHUNK_WIDTH: 16,
    CHUNK_DEPTH: 16,
    CHUNK_CACHE_WIDTH: 16,    // 16x16 chunks = 256x256 world
    LEVEL_WIDTH: 256,
    LEVEL_DEPTH: 256,
    CHUNK_COLUMNS: 256,
    CHUNK_BLOCK_COUNT: 32768,
    SEA_LEVEL: 63,             // from Level.cpp DEPTH/2 - 1
    MAX_BRIGHTNESS: 15,
    TICKS_PER_DAY: 19200,
    MIDDLE_OF_NIGHT_TIME: 12000,
    MAX_TICK_TILES_PER_TICK: 100,
  };

  /* ============================================================
   * SECTION: world/level/tile/Material
   * Mirrors: world/level/material/Material.h
   * Plain descriptor objects (no behaviour).
   * ============================================================ */
  const Material = {
    air:    { name: 'air',     blocksMotion: false, solid: false, liquid: false, replaceable: true },
    stone:  { name: 'stone',  blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    wood:   { name: 'wood',   blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    dirt:   { name: 'dirt',   blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    grass:  { name: 'grass',  blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    gravel: { name: 'gravel', blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    sand:   { name: 'sand',   blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    glass:  { name: 'glass',  blocksMotion: true,  solid: true,  liquid: false, replaceable: false, translucent: true },
    water:  { name: 'water',  blocksMotion: false, solid: false, liquid: true,  replaceable: false, translucent: true },
    lava:   { name: 'lava',   blocksMotion: false, solid: false, liquid: true,  replaceable: false, translucent: true },
    metal:  { name: 'metal',  blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    leaves: { name: 'leaves', blocksMotion: false, solid: false, liquid: false, replaceable: false, translucent: true },
    tntMat: { name: 'tnt',    blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
    wood_bark: { name: 'log', blocksMotion: true,  solid: true,  liquid: false, replaceable: false },
  };

  /* ============================================================
   * SECTION: world/level/tile/SoundType
   * Mirrors: Tile::SoundType in Tile.h (10 singletons).
   * ============================================================ */
  class SoundType {
    constructor(volume, pitch, breakSound, stepSound) {
      this.volume = volume; this.pitch = pitch;
      this.breakSound = breakSound; this.stepSound = stepSound;
    }
    static get SOUND_NORMAL() { return new SoundType(1.0, 1.0, 'stone', 'stone'); }
    static get SOUND_WOOD()   { return new SoundType(1.0, 1.0, 'wood',  'wood');  }
    static get SOUND_GRAVEL() { return new SoundType(1.0, 1.0, 'gravel','gravel'); }
    static get SOUND_GRASS()  { return new SoundType(1.0, 1.0, 'grass', 'grass'); }
    static get SOUND_STONE() { return new SoundType(1.0, 1.0, 'stone', 'stone'); }
    static get SOUND_METAL() { return new SoundType(1.0, 1.0, 'stone', 'stone'); }
    static get SOUND_GLASS() { return new SoundType(1.0, 1.0, 'glass', 'stone'); }
    static get SOUND_CLOTH() { return new SoundType(1.0, 1.0, 'cloth', 'stone'); }
    static get SOUND_SAND()  { return new SoundType(1.0, 1.0, 'sand',  'sand'); }
    static get SOUND_SILENT(){ return new SoundType(0.0, 0.0, '',     ''); }
  }

  /* ============================================================
   * SECTION: world/level/tile/Tile
   * Mirrors: world/level/tile/Tile.h
   * Render-shape constants: SHAPE_BLOCK, SHAPE_CROSS_TEXTURE, SHAPE_TORCH, etc.
   * Builder pattern via setSoundType / setDestroyTime / setLightBlock / setLightEmission.
   * ============================================================ */
  class Tile {
    static get SHAPE_INVISIBLE()     { return -1; }
    static get SHAPE_BLOCK()         { return 0; }
    static get SHAPE_CROSS_TEXTURE() { return 1; }
    static get SHAPE_TORCH()         { return 2; }
    static get SHAPE_FIRE()          { return 3; }
    static get SHAPE_WATER()         { return 4; }
    static get SHAPE_STAIRS()        { return 10; }
    static get SHAPE_FENCE()         { return 11; }
    static get SHAPE_CACTUS()        { return 13; }
    static get SHAPE_ENTITYTILE_ANIMATED() { return 22; }
    static get NUM_BLOCK_TYPES()    { return 256; }

    // tiles[256] master registry
    static tiles = new Array(256).fill(null);
    static sendTileData = new Array(256).fill(false);
    static shouldTick = new Array(256).fill(false);
    static solid = new Array(256).fill(false);
    static isEntityTile = new Array(256).fill(false);
    static translucent = new Array(256).fill(false);
    static lightBlock = new Array(256).fill(15);
    static lightEmission = new Array(256).fill(0);

    constructor(id, tex, material) {
      if (material === undefined) {
        // 2-arg form: Tile(id, material) — tex defaults to 0
        this.id = id; this.tex = 0; this.material = arguments[1];
      } else {
        this.id = id; this.tex = tex; this.material = material;
      }
      // Per-tile properties (defaults)
      this.soundType = SoundType.SOUND_STONE;
      this.destroySpeed = 0;          // destroyTime
      this.explosionResistance = 0;
      this.gravity = 1;
      this.friction = 0.6;
      this.lightBlock = 15;
      this.lightEmission = 0;
      this.category = 0;
      this.renderShape = Tile.SHAPE_BLOCK;
      // AABB shape (full cube default)
      this.xx0 = 0; this.yy0 = 0; this.zz0 = 0;
      this.xx1 = 1; this.yy1 = 1; this.zz1 = 1;
      this.descriptionId = 'tile.' + this.id;
    }

    // Builder pattern (each returns this)
    init() {
      Tile.tiles[this.id] = this;
      Tile.lightBlock[this.id] = this.lightBlock;
      Tile.lightEmission[this.id] = this.lightEmission;
      Tile.solid[this.id] = this.isSolidRender();
      Tile.translucent[this.id] = !!(this.material && this.material.translucent);
      return this;
    }
    setSoundType(s) { this.soundType = s; return this; }
    setDestroyTime(t) { this.destroySpeed = t; return this; }
    setLightBlock(b) { this.lightBlock = b; return this; }
    setLightEmission(e) { this.lightEmission = e; return this; }
    setExplodeable(r) { this.explosionResistance = r; return this; }
    setTicking(b) { Tile.shouldTick[this.id] = b; return this; }
    setCategory(c) { this.category = c; return this; }
    setDescriptionId(d) { this.descriptionId = d; return this; }
    setShape(x0, y0, z0, x1, y1, z1) {
      this.xx0 = x0; this.yy0 = y0; this.zz0 = z0;
      this.xx1 = x1; this.yy1 = y1; this.zz1 = z1;
      return this;
    }
    setRenderShape(s) { this.renderShape = s; return this; }

    // Geometry / light / texture virtuals (overridable)
    getRenderShape() { return this.renderShape; }
    getTexture(face) { return this.tex; }
    getTextureFor(level, x, y, z, face) { return this.getTexture(face); }
    isCubeShaped() {
      return this.xx0 === 0 && this.yy0 === 0 && this.zz0 === 0 &&
             this.xx1 === 1 && this.yy1 === 1 && this.zz1 === 1;
    }
    isSolidRender() {
      if (!this.material) return false;
      return this.material.solid && this.isCubeShaped();
    }
    isSolid() { return !!(this.material && this.material.blocksMotion); }
    isReplaceable() { return !!(this.material && this.material.replaceable); }
    isLiquid() { return !!(this.material && this.material.liquid); }

    // Mining progress for survival: 1 / destroySpeed (rujukan formula).
    getDestroyProgress(player) {
      if (this.destroySpeed < 0) return Infinity;  // unbreakable
      const speed = player ? player.getDestroySpeed(this) : 1;
      if (speed <= 0) return 0;
      // rujukan getDestroyProgress: 1 / (destroySpeed * toolMultiplier) approximated.
      return 1 / Math.max(this.destroySpeed, 0.01) * speed;
    }

    // Resource drop on destroy (id and count); for tiles = self.
    getResource(data, random) { return this.id; }
    getResourceCount(random) { return 1; }
    spawnResources(level, x, y, z, data) {
      // Stub: in rujukan this drops an ItemEntity. For port we simply leave it.
    }

    mayPick(data = 0, liquid = false) {
      if (this.material === Material.air) return false;
      if (this.isLiquid() && !liquid) return false;
      return true;
    }
    mayPlace(level, x, y, z, face) { return true; }
    getAABB(level, x, y, z) {
      return new AABB(x + this.xx0, y + this.yy0, z + this.zz0,
                      x + this.xx1, y + this.yy1, z + this.zz1);
    }
    getName() { return this.descriptionId; }
    shouldRenderFace(level, x, y, z, face) {
      // Cull a face if neighbor is solid-opaque
      const n = level.getTileNeighbor(x, y, z, face);
      const t = Tile.tiles[n];
      if (!t) return true;
      if (t.material === Material.air) return true;
      if (t.material === Material.glass && this.material === Material.glass) return false;
      if (this.material === Material.leaves && t.material === Material.leaves) return false;
      return !t.isSolidRender();
    }
    // Tile tick (overridden by LiquidTile, GrassTile, etc.)
    tick(level, x, y, z, random) { /* no-op */ }
    animateTick(level, x, y, z, random) { /* no-op */ }
  }

  /* ============================================================
   * SECTION: world/level/tile/GrassTile
   * Mirrors: world/level/tile/GrassTile.h
   * Top texture = grass, side = dirt-with-grass-overlay.
   * Tick: spreads to adjacent dirt (shouldTick=true).
   * ============================================================ */
  class GrassTile extends Tile {
    constructor(id, tex, material) {
      super(id, tex, material);
      this.setSoundType(SoundType.SOUND_GRASS).setDestroyTime(0.6).setExplodeable(2.5);
      this.setTicking(true);
      this.setLightBlock(15);
      this.texTop = 'grass_top';
      this.texSide = 'grass_side';
      this.texBottom = 'dirt';
    }
    getResource(data, random) { return 3; } // drops dirt
    getTexture(face) {
      if (face === 1) return this.texTop;     // up
      if (face === 0) return this.texBottom;  // down
      return this.texSide;                    // sides
    }
    tick(level, x, y, z, random) {
      // Grass spread to dirt neighbors when sky-lit.
      if (!level.isSkyLit(x, y + 1, z)) {
        if (random.nextInt(4) !== 0) return;
      }
      for (let i = 0; i < 4; i++) {
        const nx = x + random.nextInt(3) - 1;
        const ny = y + random.nextInt(5) - 3;
        const nz = z + random.nextInt(3) - 1;
        const tid = level.getTile(nx, ny, nz);
        if (tid === 3 /* dirt */ && level.isSkyLit(nx, ny + 1, nz)) {
          level.setTile(nx, ny, nz, 2 /* grass */);
        }
      }
    }
    getName() { return 'tile.grass'; }
  }

   * SECTION: world/level/tile/HeavyTile

  class HeavyTile extends Tile {
    constructor(id, tex, material) {
      super(id, tex, material);
      this.setTicking(true);
    }
    tick(level, x, y, z, random) {
      // rujukan HeavyTile: if below is air/liquid, become FallingTile.
      const below = level.getTile(x, y - 1, z);
      if (below === 0 || (Tile.tiles[below] && Tile.tiles[below].isLiquid())) {
        level.setTile(x, y, z, 0);
        // Port: simply move the block down one (rujukan spawns a FallingTile entity).
        let ny = y - 1;
        while (ny > 0) {
          const tid = level.getTile(x, ny, z);
          if (tid === 0 || (Tile.tiles[tid] && Tile.tiles[tid].isLiquid())) {
            ny--; continue;
          }
          break;
        }
        level.setTile(x, ny + 1, z, this.id);
      }
    }
  }

      // Pass 3: trees scattered on grass (only above sea level).
      for (let i = 0; i < 220; i++) {
        const x = 4 + this.rand.nextInt(W - 8);
        const z = 4 + this.rand.nextInt(D - 8);
        const topY = this.level.getTopTileY(x, z);
        if (topY < SEA) continue;
        if (this.level.getTile(x, topY, z) !== 2 /* grass */) continue;
        this._placeTree(x, topY + 1, z);
      }

      // Recalc heightmaps and mark all chunks dirty.
      for (const c of this.level.chunks.values()) {
        c.recalcHeightmap();
        c.initSkylight();
        c.dirty = true;
      }
    }
    _pickOre(depth) {
      const r = this.rand.nextInt(100);
      if (depth < 16 && r < 5) return 56; // diamond ore (rare, deep)
      if (depth < 32 && r < 10) return 14; // gold ore
      if (depth < 48 && r < 25) return 15; // iron ore
      if (r < 60) return 16;                // coal ore (common)
      return 1; // stone (no ore placed)
    }
    _placeTree(x, y, z) {
      const h = 4 + this.rand.nextInt(3);
      // Trunk
      for (let i = 0; i < h; i++) {
        this.level.setTileNoUpdate(x, y + i, z, 17);
      }
      // Leaves: two layers of radius-2 + top layer of radius-1
      const top = y + h;
      for (let dy = -2; dy <= 1; dy++) {
        const r = dy <= 0 ? 2 : 1;
        for (let dx = -r; dx <= r; dx++) {
          for (let dz = -r; dz <= r; dz++) {
            if (dx === 0 && dz === 0 && dy < 1) continue; // keep trunk
            const lx = x + dx, ly = top + dy, lz = z + dz;
            if (this.level.getTile(lx, ly, lz) === 0) {
              this.level.setTileNoUpdate(lx, ly, lz, 18);
            }
          }
        }
      }
    }
  }

  /* ============================================================
   * SECTION: world/entity/Entity

  class Entity {
    static TOTAL_AIR_SUPPLY = 300;

    constructor(level) {
      this.level = level;
      this.entityId = ++Entity.entityCounter;

      this.xo = 0; this.yo = 0; this.zo = 0;
      this.xOld = 0; this.yOld = 0; this.zOld = 0;
      this.xd = 0; this.yd = 0; this.zd = 0;
      this.yRot = 0; this.xRot = 0;
      this.yRotO = 0; this.xRotO = 0;
      this.bb = new AABB(0, 0, 0, 1, 1, 1);
      this.onGround = false;
      this.horizontalCollision = false;
      this.verticalCollision = false;
      this.collision = false;
      this.fallDistance = 0;
      this.inWater = false;
      this.wasInWater = false;
      this.noPhysics = false;
      this.removed = false;
      this.fireImmune = false;
      this.onFire = 0;
      this.airSupply = Entity.TOTAL_AIR_SUPPLY;
      this.tickCount = 0;
      this.walkDist = 0;
      this.walkDistO = 0;
      this.inChunk = false;
      this.bbWidth = 0.6;
      this.bbHeight = 1.8;
      this.heightOffset = 0;
      this.firstTick = true;
      this.makeStepSound = true;
      this.nextStep = 0;
      this.viewScale = 1.0;
    }
    setSize(w, h) {
      this.bbWidth = w; this.bbHeight = h;
    }
    setPos(x, y, z) {
      this.x = x; this.y = y; this.z = z;
      const hw = this.bbWidth / 2;
      this.bb.set(x - hw, y + this.heightOffset, z - hw,
                  x + hw, y + this.heightOffset + this.bbHeight, z + hw);
    }
    moveTo(x, y, z, yRot, xRot) {
      this.yRot = yRot; this.xRot = xRot;
      this.setPos(x, y, z);
    }
    lerpTo(x, y, z) {
      this.x = x; this.y = y; this.z = z;
      this.setPos(x, y, z);
    }
    turn(yo, xo) {
      this.yRot += yo * 0.15;
      this.xRot += xo * 0.15;
      this.xRot = Math.max(-90, Math.min(90, this.xRot));
    }
    // Clip-and-slide move (rujukan Entity::move)
    move(xa, ya, za) {
      if (this.noPhysics) {
        this.setPos(this.x + xa, this.y + ya, this.z + za);
        return;
      }
      // Compute clipped motion along each axis in order Y, X, Z (rujukan order)
      const cubes = this.level.getCubes(this, this.bb.cloneMove(xa, ya, za));
      let dx = xa, dy = ya, dz = za;
      // Y first
      for (const c of cubes) dy = c.clipYCollide(this.bb, dy);
      this.setPos(this.x, this.y + dy, this.z);
      // X
      for (const c of cubes) dx = c.clipXCollide(this.bb, dx);
      this.setPos(this.x + dx, this.y, this.z);
      // Z
      for (const c of cubes) dz = c.clipZCollide(this.bb, dz);
      this.setPos(this.x, this.y, this.z + dz);

      this.horizontalCollision = (dx !== xa) || (dz !== za);
      this.verticalCollision = (dy !== ya);
      this.onGround = this.verticalCollision && ya < 0;
      this.collision = this.horizontalCollision || this.verticalCollision;
      if (dx !== xa) this.xd = 0;
      if (dy !== ya) this.yd = 0;
      if (dz !== za) this.zd = 0;
      // walk distance accumulator
      const dd = Math.sqrt(dx * dx + dz * dz);
      this.walkDistO = this.walkDist;
      this.walkDist += dd * 0.6;
    }
    isFree(xa, ya, za) {
      const box = this.bb.cloneMove(xa, ya, za);
      const cubes = this.level.getCubes(this, box);
      for (const c of cubes) if (box.intersects(c)) return false;
      return true;
    }
    isInWater() {
      return this.level.containsAnyLiquid(this.bb, Material.water);
    }
    isInLava() {
      return this.level.containsAnyLiquid(this.bb, Material.lava);
    }
    isInsideWater() { return this.isInWater(); }
    hurt(source, dmg) { return false; }
    remove() { this.removed = true; }
    isAlive() { return !this.removed; }
    isPlayer() { return false; }
    isMob() { return false; }
    isPushable() { return false; }
    isPickable() { return false; }
    baseTick() {
      this.tickCount++;
      // Fire / lava damage (rujukan Entity::baseTick)
      if (this.isInLava()) {
        if (!this.fireImmune) this.hurt(null, 4);
      }
      // Fall damage tracking
      if (this.onGround && this.fallDistance > 0) {
        this.causeFallDamage(this.fallDistance);
        this.fallDistance = 0;
      } else if (!this.onGround && this.yd < 0) {
        this.fallDistance -= this.yd;
      }
      // Water detection
      this.wasInWater = this.inWater;
      this.inWater = this.isInWater();
      if (this.onFire > 0) this.onFire--;
    }
    causeFallDamage(d) { /* default: no damage */ }
    tick() { this.baseTick(); }
    getLookAngle() {
      const rad = this.yRot * Math.PI / 180;
      const radx = this.xRot * Math.PI / 180;
      const cosx = Math.cos(-radx - Math.PI / 2);
      const sinx = Math.sin(-radx - Math.PI / 2);
      const cosy = Math.cos(-rad);
      const siny = Math.sin(-rad);
      return new Vec3(siny * cosx, sinx, cosy * cosx);
    }
    getViewVector(a) {
      // a = partial tick — interpolation (we use 0 for port simplicity)
      return this.getLookAngle();
    }
    pick(range) {
      const a = new Vec3(this.x, this.y + this.getEyeHeight(), this.z);
      const look = this.getLookAngle();
      const b = new Vec3(a.x + look.x * range, a.y + look.y * range, a.z + look.z * range);
      return this.level.clip(a, b, false, true);
    }
    getEyeHeight() { return this.bbHeight * 0.9; }
  }

      this.runSpeed = 1;
      this.walkingSpeed = 0.7;

      this.health -= dmg;

      this.hurtDuration = 10;
      this.invulnerableTime = 20;
      if (this.health <= 0) this.die(source);
      return true;
    }
    die(source) { this.remove(); }
    knockback(source, dmg, xd, zd) {
      this.xd += xd * 0.3;
      this.zd += zd * 0.3;
    }
    swing() { this.swinging = true; this.swingTime = 0; }
    isMob() { return true; }
    isPushable() { return true; }
    aiStep() {
      // Decrease hurt timers
      if (this.hurtTime > 0) this.hurtTime--;
      if (this.attackTime > 0) this.attackTime--;
      if (this.invulnerableTime > 0) this.invulnerableTime--;
      if (this.swinging) {
        this.swingTime++;
        if (this.swingTime >= Mob.SWING_DURATION) this.swinging = false;
      }
      this.noActionTime++;
      // AI fills xxa/yya, sets jumping
      this.updateAi();
      // travel applies physics
      this.travel(this.xxa, this.yya);
      // post-step animation
      this.updateWalkAnim();
    }
    updateAi() { /* override per-subclass */ }
    travel(xa, ya) {
      // Simplified rujukan Mob::travel: forward = ya, strafe = xa.
      const speed = this.speed > 0 ? this.speed : this.walkingSpeed;
      let mx = -Math.sin(this.yRot * Math.PI / 180) * ya * speed;
      let mz =  Math.cos(this.yRot * Math.PI / 180) * ya * speed;
      mx += Math.cos(this.yRot * Math.PI / 180) * xa * speed * 0.5;
      mz += Math.sin(this.yRot * Math.PI / 180) * xa * speed * 0.5;
      // Apply friction + gravity
      this.xd += mx * 0.5;
      this.zd += mz * 0.5;
      this.yd -= 0.08;            // gravity
      this.xd *= 0.91; this.zd *= 0.91; this.yd *= 0.98;
      // Jump if requested and on ground
      if (this.jumping && this.onGround) {
        this.jumpFromGround();
      }
      // Move
      this.move(this.xd, this.yd, this.zd);
    }
    jumpFromGround() {
      this.yd = 0.42;
    }
    updateWalkAnim() {
      this.walkAnimSpeedO = this.walkAnimSpeed;
      const dd = Math.sqrt(this.xd * this.xd + this.zd * this.zd);
      let f = dd * 0.6;
      this.walkAnimPos += (f - this.walkAnimPos) * 0.4;
      this.walkAnimSpeed = f;
    }
    tick() {
      super.tick();          // baseTick
      this.aiStep();
    }
    causeFallDamage(d) {
      if (d > 2) this.hurt(null, Math.floor(d - 2));
    }
  }

        if (now - this.lastJumpPress < 300) {
          this.abilities.flying = !this.abilities.flying;

      this.xxa = this.input.xa;

          const frontBlock = this.level.getTile(fx, fy + 1, fz);
          if (Tile.tiles[frontBlock] && Tile.tiles[frontBlock].isSolidRender()) {

  /* ============================================================
   * SECTION: client/gamemode/SurvivalMode
   * Mirrors: client/gamemode/SurvivalMode.h / .cpp

   * invulnerable=false, canHurtPlayer=true.
   * ============================================================ */
  class SurvivalMode extends GameMode {
    constructor(minecraft) {
      super(minecraft);
      this.destroyDelay = 5;
    }
    createPlayer(level) { return new LocalPlayer(this.minecraft, level, false); }
    initAbilities(player) {
      player.abilities.mayfly = false;
      player.abilities.instabuild = false;
      player.abilities.invulnerable = false;
      player.abilities.walkingSpeed = Player.DEFAULT_WALK_SPEED;
      player.abilities.flyingSpeed = Player.DEFAULT_FLY_SPEED;
    }
    canHurtPlayer() { return true; }
    isSurvivalType() { return true; }
    startDestroyBlock(x, y, z, face) {
      this.destroyPos = { x, y, z };
      this.destroyProgress = 0;
      this.lastHit = { x, y, z };
    }
    continueDestroyBlock(x, y, z, face, dt) {
      // Progress toward breaking this block.
      if (!this.destroyPos || this.destroyPos.x !== x || this.destroyPos.y !== y || this.destroyPos.z !== z) {
        this.startDestroyBlock(x, y, z, face);
        return;
      }
      const id = this.minecraft.level.getTile(x, y, z);
      const tile = Tile.tiles[id];
      if (!tile || tile.destroySpeed < 0) return;
      const prog = tile.getDestroyProgress(this.minecraft.player);
      if (prog === Infinity) return;
      this.destroyProgress += prog * dt;
      if (this.destroyProgress >= 1) {
        this.destroyBlock(x, y, z);
        this.destroyPos = null;
        this.destroyProgress = 0;
      }
    }
    stopDestroyBlock(x, y, z) {
      this.destroyPos = null;
      this.destroyProgress = 0;
    }
  }

  class Timer {
    static get TICKS_PER_SECOND() { return 20; }
    static get MAX_TICKS_PER_UPDATE() { return 10; }
    constructor(ticksPerSecond = Timer.TICKS_PER_SECOND) {
      this.ticksPerSecond = ticksPerSecond;
      this.a = 0;                 // partial tick fraction for render interpolation
      this.passedTime = 0;
      this.ticks = 0;
      this.lastTime = performance.now();
      this.timeScale = 1.0;
    }
    advanceTime() {
      const now = performance.now();
      let elapsedNanos = now - this.lastTime;
      this.lastTime = now;
      if (elapsedNanos > 1000) elapsedNanos = 1000;     // clamp huge frame skips
      if (elapsedNanos < 0)   elapsedNanos = 0;
      this.passedTime += elapsedNanos * this.timeScale;
      // rujukan: a = (passedTime / 1000) * tps, ticks = floor(a), a -= ticks, clamp to MAX.
      this.a = this.passedTime / (1000 / this.ticksPerSecond);
      this.ticks = Math.floor(this.a);
      this.a -= this.ticks;
      if (this.ticks > Timer.MAX_TICKS_PER_UPDATE) this.ticks = Timer.MAX_TICKS_PER_UPDATE;
      this.passedTime -= this.ticks * (1000 / this.ticksPerSecond);
      return this.ticks;
    }
  }

      if (this.leftDown && minecraft.hitResult && minecraft.hitResult.isHit()) {
        const hr = minecraft.hitResult;
        minecraft.gameMode.continueDestroyBlock(hr.x, hr.y, hr.z, hr.f, 1);
      } else if (minecraft.gameMode.destroyPos) {
        minecraft.gameMode.stopDestroyBlock(minecraft.gameMode.destroyPos.x,
                                            minecraft.gameMode.destroyPos.y,
                                            minecraft.gameMode.destroyPos.z);
      }
      if (this.leftClicked) {
        this.leftClicked = false;
        if (minecraft.hitResult && minecraft.hitResult.isHit()) {
          const hr = minecraft.hitResult;
          minecraft.gameMode.startDestroyBlock(hr.x, hr.y, hr.z, hr.f);
        }
      }
      if (this.rightClicked) {
        this.rightClicked = false;
        const hr = minecraft.hitResult;
        if (hr && hr.isHit()) {
          const stack = minecraft.player.inventory.getSelected();
          if (stack) {
            minecraft.gameMode.useItemOn(stack, hr.x, hr.y, hr.z, hr.f, 0, 0, 0);
          }
        }
      }
    }
  }

  /* ============================================================
   * SECTION: client/renderer/Textures
   * Mirrors: client/renderer/Textures.h
   * Loads block textures from ./VoxelCraft/textures/blocks/ into
   * an atlas (canvas) used by chunk meshes.
   * ============================================================ */
  class Textures {
    constructor() {
      this.cache = new Map();    // name → HTMLCanvasElement (16x16)
      this.atlas = null;          // THREE.Texture (canvas atlas)
      this.atlasCanvas = null;
      this.tileSize = 16;
      this.cols = 16;
      this.rows = 16;
      this.names = [];
      this._loadCount = 0;
      this._expected = 0;
      this._onReady = null;
    }
    load(names, onReady) {
      this._onReady = onReady;
      this.names = names.slice();
      this._expected = names.length;
      this.atlasCanvas = document.createElement('canvas');
      this.atlasCanvas.width = this.tileSize * this.cols;
      this.atlasCanvas.height = this.tileSize * this.rows;
      const ctx = this.atlasCanvas.getContext('2d');
      ctx.fillStyle = '#ff00ff';
      ctx.fillRect(0, 0, this.atlasCanvas.width, this.atlasCanvas.height);
      let loaded = 0;
      names.forEach((name, i) => {
        const img = new Image();
        img.onload = () => {
          const cx = (i % this.cols) * this.tileSize;
          const cy = ((i / this.cols) | 0) * this.tileSize;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(img, cx, cy, this.tileSize, this.tileSize);
          // cache canvas snapshot for HUD
          const cacheCanvas = document.createElement('canvas');
          cacheCanvas.width = this.tileSize; cacheCanvas.height = this.tileSize;
          cacheCanvas.getContext('2d').drawImage(img, 0, 0);
          this.cache.set(name, cacheCanvas);
          loaded++;
          if (loaded === this._expected) this._finish();
        };
        img.onerror = () => {
          // magenta fallback
          const cx = (i % this.cols) * this.tileSize;
          const cy = ((i / this.cols) | 0) * this.tileSize;
          ctx.fillStyle = '#ff00ff';
          ctx.fillRect(cx, cy, this.tileSize, this.tileSize);
          const cacheCanvas = document.createElement('canvas');
          cacheCanvas.width = this.tileSize; cacheCanvas.height = this.tileSize;
          this.cache.set(name, cacheCanvas);
          loaded++;
          if (loaded === this._expected) this._finish();
        };
        img.src = './VoxelCraft/textures/blocks/' + name + '.png';
      });
    }
    _finish() {
      this.atlas = new THREE.CanvasTexture(this.atlasCanvas);
      this.atlas.magFilter = THREE.NearestFilter;
      this.atlas.minFilter = THREE.NearestFilter;
      this.atlas.generateMipmaps = false;
      this.atlas.wrapS = THREE.ClampToEdgeWrapping;
      this.atlas.wrapT = THREE.ClampToEdgeWrapping;
      this.atlas.needsUpdate = true;
      if (this._onReady) this._onReady();
    }
    uvOf(name) {
      // Returns { u0, v0, u1, v1 } in atlas coordinates (0..1).
      const idx = this.names.indexOf(name);
      if (idx < 0) return { u0: 0, v0: 0, u1: 1 / this.cols, v1: 1 / this.rows };
      const cx = idx % this.cols;
      const cy = (idx / this.cols) | 0;
      const u0 = cx / this.cols;
      const v0 = 1 - (cy + 1) / this.rows;
      const u1 = (cx + 1) / this.cols;
      const v1 = 1 - cy / this.rows;
      return { u0, v0, u1, v1 };
    }
    canvasFor(name) { return this.cache.get(name); }
    tick() { /* no animation tick for port */ }
  }

  /* ============================================================
   * SECTION: client/renderer/Tesselator
   * Mirrors: client/renderer/Tesselator.h
   * Vertex accumulator wrapping a THREE.BufferGeometry builder.
   * ============================================================ */
  class Tesselator {
    constructor() {
      this.positions = [];
      this.normals = [];
      this.uvs = [];
      this.indices = [];
      this._idx = 0;
    }
    clear() {
      this.positions.length = 0;
      this.normals.length = 0;
      this.uvs.length = 0;
      this.indices.length = 0;
      this._idx = 0;
    }
    vertex(x, y, z) {
      this.positions.push(x, y, z);
      this._idx++;
      return this;
    }
    normal(x, y, z) { this.normals.push(x, y, z); return this; }
    uv(u, v) { this.uvs.push(u, v); return this; }
    tri(a, b, c) {
      this.indices.push(this._idx - 3 + a, this._idx - 3 + b, this._idx - 3 + c);
    }
    finish() {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
      if (this.normals.length) g.setAttribute('normal', new THREE.Float32BufferAttribute(this.normals, 3));
      if (this.uvs.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uvs, 2));
      if (this.indices.length) g.setIndex(this.indices);
      return g;
    }
    empty() { return this._idx === 0; }
  }

  /* ============================================================
   * SECTION: client/renderer/Chunk
   * Mirrors: client/renderer/LevelRenderer::Chunk
   * One BufferGeometry mesh per chunk (port simplification).
   * ============================================================ */
  class Chunk {
    constructor(levelRenderer, level, cx, cz) {
      this.levelRenderer = levelRenderer;
      this.level = level;
      this.cx = cx; this.cz = cz;
      this.mesh = null;            // opaque mesh
      this.transparentMesh = null; // leaves/glass/water (alpha-tested)
      this.waterMesh = null;
      this.dirty = true;
    }
    rebuild() {
      this.dirty = false;
      const opaque = new Tesselator();
      const transparent = new Tesselator();
      const water = new Tesselator();
      const textures = this.levelRenderer.textures;
      const baseX = this.cx * 16, baseZ = this.cz * 16;
      const level = this.level;
      // Iterate blocks
      for (let x = 0; x < 16; x++) {
        for (let z = 0; z < 16; z++) {
          for (let y = 0; y < LevelConstants.LEVEL_HEIGHT; y++) {
            const id = level.getTile(baseX + x, y, baseZ + z);
            if (id === 0) continue;
            const tile = Tile.tiles[id];
            if (!tile) continue;
            const wx = baseX + x, wy = y, wz = baseZ + z;
            const renderShape = tile.getRenderShape();
            if (renderShape === Tile.SHAPE_BLOCK) {
              this._emitCube(opaque, transparent, water, tile, level, wx, wy, wz, textures);
            } else if (renderShape === Tile.SHAPE_TORCH) {
              this._emitCross(transparent, tile, level, wx, wy, wz, textures, 0.6);
            } else if (renderShape === Tile.SHAPE_WATER) {
              this._emitWater(water, tile, level, wx, wy, wz, textures);
            } else if (renderShape === Tile.SHAPE_CROSS_TEXTURE) {
              this._emitCross(transparent, tile, level, wx, wy, wz, textures, 1.0);
            } else {
              // Fall back to cube shape.
              this._emitCube(opaque, transparent, water, tile, level, wx, wy, wz, textures);
            }
          }
        }
      }
      // Replace meshes
      this._replaceMesh('mesh', opaque, false);
      this._replaceMesh('transparentMesh', transparent, true);
      this._replaceMesh('waterMesh', water, true);
    }
    _replaceMesh(field, tess, alphaTest) {
      const scene = this.levelRenderer.scene;
      if (this[field]) {
        scene.remove(this[field]);
        this[field].geometry.dispose();
      }
      if (tess.empty()) { this[field] = null; return; }
      const geom = tess.finish();
      geom.computeVertexNormals();
      const mat = alphaTest
        ? new THREE.MeshLambertMaterial({
            map: this.levelRenderer.textures.atlas,
            transparent: true,
            alphaTest: 0.5,
            side: THREE.DoubleSide,
          })
        : new THREE.MeshLambertMaterial({ map: this.levelRenderer.textures.atlas });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.frustumCulled = true;
      scene.add(mesh);
      this[field] = mesh;
    }
    _emitCube(opaque, transparent, water, tile, level, x, y, z, textures) {
      // Standard 6-face cube. Cull faces hidden by solid neighbours.
      const translucent = tile.material && tile.material.translucent;
      const isWater = tile.material === Material.water || tile.material === Material.lava;
      const target = isWater ? water : (translucent ? transparent : opaque);
      const faces = [
        // dir, normal, [x0,y0,z0, x1,y1,z1, x2,y2,z2, x3,y3,z3], faceIndex
        { dir: [0, -1, 0], n: [0, -1, 0], face: 0,
          q: [[x, y, z + 1], [x, y, z], [x + 1, y, z], [x + 1, y, z + 1]] },
        { dir: [0, 1, 0], n: [0, 1, 0], face: 1,
          q: [[x, y + 1, z], [x, y + 1, z + 1], [x + 1, y + 1, z + 1], [x + 1, y + 1, z]] },
        { dir: [0, 0, -1], n: [0, 0, -1], face: 2,
          q: [[x, y, z], [x, y + 1, z], [x + 1, y + 1, z], [x + 1, y, z]] },
        { dir: [0, 0, 1], n: [0, 0, 1], face: 3,
          q: [[x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1], [x, y, z + 1]] },
        { dir: [-1, 0, 0], n: [-1, 0, 0], face: 4,
          q: [[x, y, z + 1], [x, y + 1, z + 1], [x, y + 1, z], [x, y, z]] },
        { dir: [1, 0, 0], n: [1, 0, 0], face: 5,
          q: [[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]] },
      ];
      for (const f of faces) {
        const visible = tile.shouldRenderFace(level, x + f.dir[0], y + f.dir[1], z + f.dir[2], f.face);
        if (!visible) continue;
        // Texture name override per face (e.g., grass top/bottom)
        let tname;
        if (typeof tile.getTexture === 'function') tname = tile.getTexture(f.face);
        else tname = tile.tex;
        const uv = textures.uvOf(tname);
        // Quad winding (CCW)
        const q = f.q;
        target.vertex(q[0][0], q[0][1], q[0][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u0, uv.v1);
        target.vertex(q[1][0], q[1][1], q[1][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u0, uv.v0);
        target.vertex(q[2][0], q[2][1], q[2][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u1, uv.v0);
        target.vertex(q[3][0], q[3][1], q[3][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u1, uv.v1);
        // Two triangles (0,1,2) and (0,2,3)
        target.tri(0, 1, 2);
        target.tri(0, 2, 3);
      }
    }
    _emitCross(target, tile, level, x, y, z, textures, scale) {
      const texName = tile.getTexture ? tile.getTexture(2) : tile.tex;
      const uv = textures.uvOf(texName);
      // Two intersecting quads (X-shape)
      const x0 = x + (1 - scale) / 2;
      const x1 = x + (1 + scale) / 2;
      const z0 = z + (1 - scale) / 2;
      const z1 = z + (1 + scale) / 2;
      // Quad 1: from (x0,y,z0) to (x1,y+1,z1) — diagonal X+Z+
      target.vertex(x0, y + 1, z0).normal(1, 0, 0).uv(uv.u0, uv.v0);
      target.vertex(x1, y + 1, z1).normal(1, 0, 0).uv(uv.u1, uv.v0);
      target.vertex(x1, y,     z1).normal(1, 0, 0).uv(uv.u1, uv.v1);
      target.vertex(x0, y,     z0).normal(1, 0, 0).uv(uv.u0, uv.v1);
      target.tri(0, 1, 2); target.tri(0, 2, 3);
      // Quad 2: from (x0,y,z1) to (x1,y+1,z0)
      target.vertex(x0, y + 1, z1).normal(-1, 0, 0).uv(uv.u0, uv.v0);
      target.vertex(x1, y + 1, z0).normal(-1, 0, 0).uv(uv.u1, uv.v0);
      target.vertex(x1, y,     z0).normal(-1, 0, 0).uv(uv.u1, uv.v1);
      target.vertex(x0, y,     z1).normal(-1, 0, 0).uv(uv.u0, uv.v1);
      target.tri(0, 1, 2); target.tri(0, 2, 3);
    }
    _emitWater(target, tile, level, x, y, z, textures) {
      const texName = tile.getTexture ? tile.getTexture(0) : tile.tex;
      const uv = textures.uvOf(texName);
      // Render only top face and sides where neighbor is air/non-water.
      const height = 1.0;
      const faces = [
        { n: [0, -1, 0], face: 0,
          q: [[x, y, z + 1], [x, y, z], [x + 1, y, z], [x + 1, y, z + 1]] },
        { n: [0, 1, 0], face: 1,
          q: [[x, y + height, z], [x, y + height, z + 1], [x + 1, y + height, z + 1], [x + 1, y + height, z]] },
        { n: [0, 0, -1], face: 2,
          q: [[x, y, z], [x, y + height, z], [x + 1, y + height, z], [x + 1, y, z]] },
        { n: [0, 0, 1], face: 3,
          q: [[x + 1, y, z + 1], [x + 1, y + height, z + 1], [x, y + height, z + 1], [x, y, z + 1]] },
        { n: [-1, 0, 0], face: 4,
          q: [[x, y, z + 1], [x, y + height, z + 1], [x, y + height, z], [x, y, z]] },
        { n: [1, 0, 0], face: 5,
          q: [[x + 1, y, z], [x + 1, y + height, z], [x + 1, y + height, z + 1], [x + 1, y, z + 1]] },
      ];
      for (const f of faces) {
        const nx = x + (f.face === 4 ? -1 : f.face === 5 ? 1 : 0);
        const ny = y + (f.face === 0 ? -1 : f.face === 1 ? 1 : 0);
        const nz = z + (f.face === 2 ? -1 : f.face === 3 ? 1 : 0);
        const nt = Tile.tiles[level.getTile(nx, ny, nz)];
        if (nt && nt.material === tile.material) continue;
        if (nt && nt.isSolidRender()) continue;
        const q = f.q;
        target.vertex(q[0][0], q[0][1], q[0][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u0, uv.v1);
        target.vertex(q[1][0], q[1][1], q[1][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u0, uv.v0);
        target.vertex(q[2][0], q[2][1], q[2][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u1, uv.v0);
        target.vertex(q[3][0], q[3][1], q[3][2]).normal(f.n[0], f.n[1], f.n[2]).uv(uv.u1, uv.v1);
        target.tri(0, 1, 2); target.tri(0, 2, 3);
      }
    }
    dispose() {
      const scene = this.levelRenderer.scene;
      if (this.mesh) { scene.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh = null; }
      if (this.transparentMesh) { scene.remove(this.transparentMesh); this.transparentMesh.geometry.dispose(); this.transparentMesh = null; }
      if (this.waterMesh) { scene.remove(this.waterMesh); this.waterMesh.geometry.dispose(); this.waterMesh = null; }
    }
  }

  /* ============================================================
   * SECTION: client/renderer/LevelRenderer
   * Mirrors: client/renderer/LevelRenderer.h
   * Manages Map<chunkKey, Chunk>, dirty-chunk queue, render.
   * ============================================================ */
  class LevelRenderer {
    static get MAX_VISIBLE_REBUILDS_PER_FRAME() { return 3; }
    static get MAX_INVISIBLE_REBUILDS_PER_FRAME() { return 1; }
    constructor(minecraft, scene, textures) {
      this.minecraft = minecraft;
      this.scene = scene;
      this.textures = textures;
      this.chunks = new Map();
      this.dirtyQueue = [];
      this.highlightMesh = null;
    }
    setLevel(level) {
      // Clear existing chunk meshes.
      for (const c of this.chunks.values()) c.dispose();
      this.chunks.clear();
      this.dirtyQueue.length = 0;
      this.level = level;
      // Build chunk objects for the whole 16x16 grid.
      for (let cx = 0; cx < LevelConstants.CHUNK_CACHE_WIDTH; cx++) {
        for (let cz = 0; cz < LevelConstants.CHUNK_CACHE_WIDTH; cz++) {
          const c = new Chunk(this, level, cx, cz);
          this.chunks.set(cx + ',' + cz, c);
          this.dirtyQueue.push(c);
        }
      }
      // Highlight box
      if (!this.highlightMesh) {
        const geom = new THREE.BoxGeometry(1.002, 1.002, 1.002);
        const edges = new THREE.EdgesGeometry(geom);
        const mat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 });
        this.highlightMesh = new THREE.LineSegments(edges, mat);
        this.highlightMesh.visible = false;
        this.scene.add(this.highlightMesh);
      }
    }
    scheduleRebuild(cx, cz) {
      const c = this.chunks.get(cx + ',' + cz);
      if (c) { c.dirty = true; if (this.dirtyQueue.indexOf(c) < 0) this.dirtyQueue.push(c); }
    }
    tick() {
      // Rebuild a few dirty chunks per tick (rujukan MAX_VISIBLE_REBUILDS_PER_FRAME=3).
      let n = 0;
      while (this.dirtyQueue.length && n < LevelRenderer.MAX_VISIBLE_REBUILDS_PER_FRAME) {
        const c = this.dirtyQueue.shift();
        if (c.dirty) { c.rebuild(); n++; }
      }
    }
    render(a) {
      // Update highlight box position from current hitResult.
      const hr = this.minecraft.hitResult;
      if (hr && hr.isHit() && hr.type === HitResult.TILE) {
        this.highlightMesh.visible = true;
        this.highlightMesh.position.set(hr.x + 0.5, hr.y + 0.5, hr.z + 0.5);
      } else {
        this.highlightMesh.visible = false;
      }
    }
    allDirty() {
      for (const c of this.chunks.values()) c.dirty = true;
      this.dirtyQueue.length = 0;
      for (const c of this.chunks.values()) this.dirtyQueue.push(c);
    }
  }

  /* ============================================================
   * SECTION: client/renderer/GameRenderer
   * Mirrors: client/renderer/GameRenderer.h / .cpp
   * Positions camera at player eye, renders level + gui overlay.
   * ============================================================ */
  class GameRenderer {
    constructor(minecraft, camera) {
      this.minecraft = minecraft;
      this.camera = camera;
    }
    tick() {
      // rujukan: interpolation prep; no-op for port.
    }
    setupCamera(a) {
      const p = this.minecraft.player;
      if (!p) return;
      const eye = p.getEyeHeight();
      this.camera.position.set(p.x, p.y + eye, p.z);
      const yaw = p.yRot * Math.PI / 180;
      const pitch = p.xRot * Math.PI / 180;
      this.camera.rotation.order = 'YXZ';
      this.camera.rotation.y = -yaw;
      this.camera.rotation.x = pitch;
    }
    pick(a) {
      // rujukan GameRenderer::pick: ray-trace from player eye to PICK_RANGE.
      const p = this.minecraft.player;
      if (!p) { this.minecraft.hitResult = HitResult.NO_HIT(); return; }
      const eye = new Vec3(p.x, p.y + p.getEyeHeight(), p.z);
      const look = p.getLookAngle();
      const r = this.minecraft.gameMode.getPickRange();
      const end = new Vec3(eye.x + look.x * r, eye.y + look.y * r, eye.z + look.z * r);
      this.minecraft.hitResult = this.minecraft.level.clip(eye, end, false, true);
    }
    render(a) {
      this.setupCamera(a);
      this.pick(a);
      this.minecraft.levelRenderer.render(a);
    }
  }

  /* ============================================================
   * SECTION: client/particle/ParticleEngine
   * Mirrors: client/particle/ParticleEngine.h / .cpp
   * Particle pool + tick + render. destroy(x,y,z,tile) spawns
   * TerrainParticle set on block break.
   * ============================================================ */
  class ParticleEngine {
    constructor(levelRenderer) {
      this.levelRenderer = levelRenderer;
      this.particles = [];
      this.scene = levelRenderer.scene;
    }
    destroy(x, y, z, tile) {
      // rujukan ParticleEngine::destroy spawns ~27 TerrainParticles.
      const texName = tile.getTexture ? tile.getTexture(0) : tile.tex;
      const uv = this.levelRenderer.textures.uvOf(texName);
      for (let i = 0; i < 16; i++) {
        const px = x + Math.random();
        const py = y + Math.random();
        const pz = z + Math.random();
        const size = 0.1 + Math.random() * 0.05;
        const geom = new THREE.PlaneGeometry(size, size);
        const mat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          map: this.levelRenderer.textures.atlas,
          transparent: true, alphaTest: 0.5,
        });
        // UV per particle: use the atlas offset for this texture
        geom.setAttribute('uv', new THREE.Float32BufferAttribute([
          uv.u0, uv.v0, uv.u1, uv.v0, uv.u0, uv.v1, uv.u1, uv.v1
        ], 2));
        const m = new THREE.Mesh(geom, mat);
        m.position.set(px, py, pz);
        this.scene.add(m);
        this.particles.push({
          mesh: m, life: 30 + Math.random() * 20,
          vx: (Math.random() - 0.5) * 0.3,
          vy: 0.1 + Math.random() * 0.3,
          vz: (Math.random() - 0.5) * 0.3,
        });
      }
    }
    tick() {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.life--;
        if (p.life <= 0) {
          this.scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          this.particles.splice(i, 1);
          continue;
        }
        p.vy -= 0.04;
        p.mesh.position.x += p.vx;
        p.mesh.position.y += p.vy;
        p.mesh.position.z += p.vz;
        p.mesh.rotation.x += 0.1;
        p.mesh.rotation.y += 0.1;
      }
    }
    render(player, a) { /* particles are scene meshes */ }
    crack(x, y, z, face) { /* stub */ }
  }

  /* ============================================================

  class GuiComponent {
    static drawString(font, text, x, y, color) { /* DOM-driven for port */ }

  /* ============================================================
   * SECTION: client/gui/Font
   * Mirrors: client/gui/Font.h
   * Uses the VoxelCraft font (Minecraft Ten) loaded via CSS @font-face.
   * ============================================================ */
  class Font {
    constructor() {
      this.family = 'Minecraft Ten, monospace';
      this.size = 12;
    }
    width(text) { return text.length * 7; }
    draw(ctx, text, x, y, color) {
      ctx.font = this.size + 'px ' + this.family;
      ctx.fillStyle = '#000';
      ctx.fillText(text, x + 1, y + 1);
      ctx.fillStyle = color || '#fff';
      ctx.fillText(text, x, y);
    }
  }

  /* ============================================================
   * SECTION: client/gui/Button
   * Mirrors: client/gui/components/Button.h
   * id, msg, x, y, w, h, active, visible, selected.
   * For port we render DOM buttons inside #overlay.
   * ============================================================ */
  class Button {
    constructor(id, msg, x, y, w, h) {
      this.id = id;
      this.msg = msg;
      this.x = x; this.y = y; this.w = w; this.h = h;
      this.active = true;
      this.visible = true;
      this.selected = false;
      this.pressed = false;
      this._el = null;
    }
    render(parent) {
      if (!this._el) {
        const el = document.createElement('button');
        el.className = 'mc-btn' + (this.active ? '' : ' disabled');
        el.textContent = this.msg;
        parent.appendChild(el);
        this._el = el;
      }
      this._el.textContent = this.msg;
      this._el.style.display = this.visible ? 'block' : 'none';
      this._el.disabled = !this.active;
    }
    isInside(x, y) {
      return x >= this.x && x <= this.x + this.w &&
             y >= this.y && y <= this.y + this.h;
    }
    setPressed() { this.pressed = true; }
    released() { /* hook */ }
    getYImage() { return !this.active ? 0 : (this.selected ? 2 : 1); }
  }

  /* ============================================================
   * SECTION: client/gui/Screen
   * Mirrors: client/gui/Screen.h / .cpp
   * Lifecycle: init → init() → setupPositions() → updateTabButtonSelection()
   * Render: renderBackground() → render buttons → subclass render.
   * Mouse: mouseClicked → hit-test buttons → press. mouseReleased → buttonClicked.
   * Key: ESC → minecraft.setScreen(null).
   * ============================================================ */
  class Screen {
    constructor() {
      this.buttons = [];
      this.tabButtons = [];
      this.textBoxes = [];
      this.minecraft = null;
      this.font = null;
      this.width = 0; this.height = 0;
      this.clickedButton = null;
      this.passEvents = false;
      this.isInGameScreen = false;
    }
    init(minecraft, w, h) {
      this.minecraft = minecraft;
      this.font = minecraft.font;
      this.width = w;
      this.height = h;
      this.buttons.length = 0;
      this.tabButtons.length = 0;
      this.textBoxes.length = 0;
      this.initScreen();  // virtual (rujukan calls this `init()` but JS has no overloading)
      this.setupPositions();
      this.updateTabButtonSelection();
    }
    initScreen() {}                 // virtual — rujukan names this `init()`; renamed to avoid JS collision with lifecycle init(minecraft,w,h)
    setupPositions() {}             // virtual
    updateTabButtonSelection() {
      for (const b of this.tabButtons) b.selected = false;
      if (this.tabButtons.length) this.tabButtons[0].selected = true;
    }
    render(xm, ym, a) {
      this.renderBackground();
      // DOM button render happens in subclasses via renderDOM.
    }
    renderBackground() { /* default: dim overlay */ }
    renderDirtBackground() { /* dirt-bg override */ }
    tick() {}
    removed() {}
    mouseEvent(x, y) {}
    keyboardEvent(key) {}
    mouseClicked(x, y, button) {
      for (const b of this.buttons) {
        if (b.isInside(x, y)) {
          this.clickedButton = b;
          b.setPressed();
          break;
        }
      }
    }
    mouseReleased(x, y, button) {
      if (this.clickedButton && this.clickedButton.isInside(x, y)) {
        this.buttonClicked(this.clickedButton);
        // play click sound (SoundEngine::playUI random.click)
        if (this.minecraft.soundEngine) this.minecraft.soundEngine.playUI('random.click');
      }
      this.clickedButton = null;
    }
    keyPressed(key) {
      if (key === 'Escape') {
        this.minecraft.setScreen(null);
        return true;
      }
      // Tab navigation via options.keyMenuNext/Previous/Ok
      return false;
    }
    buttonClicked(button) { /* virtual */ }
    handleBackEvent() { return false; }
  }

  /* ============================================================
   * SECTION: client/gui/screens/StartMenuScreen
   * Mirrors: client/gui/screens/StartMenuScreen.h / .cpp
   * Buttons: bHost (Start Game id=2), bJoin (Join Game id=3),

  class StartMenuScreen extends Screen {
    initScreen() {
      this.bHost = new Button(2, 'Start Game', 0, 0, 220, 24);
      this.bJoin = new Button(3, 'Join Game',  0, 0, 220, 24);
      this.bOptions = new Button(4, 'Options', 0, 0, 220, 24);
      // The 2013 StartMenuScreen has Host, Join, and Options; no mode-toggle button.
      this.buttons = [this.bHost, this.bJoin, this.bOptions];
      this.tabButtons = this.buttons.slice();
      this.creativeMode = true;
    }
    setupPositions() {
      // DOM layout: handled by renderDOM.
    }
    buttonClicked(button) {
      if (button === this.bHost) {
        this.minecraft.selectLevel(this.creativeMode);
      } else if (button === this.bJoin) {
        // rujukan's JoinGameScreen depends on native multiplayer services.
        // Do not leave the original menu action silently inert in a browser port.
        window.alert('Join Game: multiplayer networking is not implemented in this browser port.');
      } else if (button === this.bOptions) {
        window.alert('Options: native MCPE settings are not yet ported to this browser screen.');
      }
    }
    handleBackEvent() {
      // rujukan: quit the app — for port we just stay.
      return true;
    }
    render(xm, ym, a) {
      // Subclass render on top of background.
    }
    renderDOM(parent) {
      parent.innerHTML = '';
      const panel = document.createElement('div');
      panel.className = 'panel';
      const h = document.createElement('h1');
      h.textContent = 'VoxelCraft';
      panel.appendChild(h);
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = 'Rujukan Faithful Port · MCPE 2013';
      panel.appendChild(sub);
      parent.appendChild(panel);
      const btns = document.createElement('div');
      btns.style.display = 'flex'; btns.style.flexDirection = 'column';
      btns.style.alignItems = 'center'; btns.style.gap = '8px';
      btns.style.marginTop = '14px'; btns.style.width = '100%';
      panel.appendChild(btns);
      for (const b of this.buttons) {
        b.render(btns);
        // hook click → buttonClicked
        b._el.onclick = () => this.buttonClicked(b);
      }
      // Help text
      const help = document.createElement('div');
      help.style.cssText = 'margin-top:18px;font-size:12px;color:#bbb;line-height:1.7;max-width:420px;';
      help.innerHTML = `
        <div style="margin-bottom:8px;color:#fff;">Controls</div>
        <div>WASD = move · Mouse = look · Space = jump (double-tap = toggle fly in Creative)</div>
        <div>Left-click = destroy · Right-click = place · 1–9 = hotbar slot</div>
        <div>Shift = sneak · E = inventory · ESC = pause</div>

  /* ============================================================
   * SECTION: client/gui/screens/PauseScreen
   * Mirrors: client/gui/screens/PauseScreen.h / .cpp
   * Buttons: Resume, Quit. isInGameScreen=true.
   * ============================================================ */
  class PauseScreen extends Screen {
    initScreen() {
      this.bResume = new Button(0, 'Resume', 0, 0, 220, 24);
      this.bQuit   = new Button(1, 'Quit to Title', 0, 0, 220, 24);
      this.buttons = [this.bResume, this.bQuit];
      this.tabButtons = this.buttons.slice();
      this.isInGameScreen = true;

    buttonClicked(button) {
      if (button === this.bResume) this.minecraft.setScreen(null);

      parent.innerHTML = '';
