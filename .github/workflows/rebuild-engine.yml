name: VoxelCraft rebuild checks

# Verifies the in-repo VoxelCraft engine (src/game) and the published
# minecraft.html stay green on every push to main. Stages kitab-suci
# assets from rujukan/ only (no modern RP mixing, per user directive:
# "struktur dan asset 1:1 dengan minecraft 2013").

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and reference submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Stage kitab-suci assets from rujukan source
        run: |
          set -euo pipefail
          RUJUKAN=rujukan/pocket-edition-2013/mcpe-source/handheld/project/android/assets
          mkdir -p public/VoxelCraft/textures/blocks public/VoxelCraft/textures/gui \
                   public/VoxelCraft/font public/VoxelCraft/textures/environment \
                   public/VoxelCraft/textures/mob
          cp "$RUJUKAN/terrain.png"        public/VoxelCraft/textures/blocks/terrain.png
          cp "$RUJUKAN/gui/gui.png"         public/VoxelCraft/textures/gui/gui.png
          cp "$RUJUKAN/gui/icons.png"       public/VoxelCraft/textures/gui/icons.png
          cp "$RUJUKAN/gui/items.png"       public/VoxelCraft/textures/gui/items.png
          cp "$RUJUKAN/gui/gui_blocks.png"  public/VoxelCraft/textures/gui/gui_blocks.png
          cp "$RUJUKAN/gui/title.png"       public/VoxelCraft/textures/gui/title.png
          cp "$RUJUKAN/gui/background.png"  public/VoxelCraft/textures/gui/background.png
          cp "$RUJUKAN/font/default8.png"   public/VoxelCraft/font/default8.png
          cp "$RUJUKAN/environment/clouds.png" public/VoxelCraft/textures/environment/clouds.png
          cp "$RUJUKAN/mob/chicken.png"     public/VoxelCraft/textures/mob/chicken.png
          cp "$RUJUKAN/particles.png"       public/VoxelCraft/textures/particles.png
          echo "Staged 11 kitab-suci assets from rujukan/"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build voxel engine bundle
        run: |
          if [ -f src/game/browser-entry.ts ]; then
            bun build src/game/browser-entry.ts --target browser --outfile public/voxelcraft-engine.bundle.js
          else
            echo "No src/game/browser-entry.ts, using committed bundle"
          fi

      - name: Test game-core mechanics
        run: bun run test:game-core

      - name: Build application
        run: bun run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/minecraft.html
          # The 6 assets minecraft.html actually references (kitab suci):
          for f in \
            out/VoxelCraft/textures/blocks/terrain.png \
            out/VoxelCraft/textures/gui/gui.png \
            out/VoxelCraft/textures/gui/icons.png \
            out/VoxelCraft/textures/gui/items.png \
            out/VoxelCraft/textures/environment/clouds.png \
            out/VoxelCraft/textures/mob/chicken.png ; do
            test -s "$f" || { echo "FAIL: missing $f"; exit 1; }
          done
          if [ -f public/voxelcraft-engine.bundle.js ]; then
            test -s out/voxelcraft-engine.bundle.js
            grep -q 'VoxelCraftEngine' out/voxelcraft-engine.bundle.js
          fi
          echo "Rebuild checks: OK"
