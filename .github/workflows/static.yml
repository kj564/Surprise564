name: Build and deploy VoxelCraft browser game to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage original MCPE 2013 textures from rujukan source
        run: |
          # minecraft.html uses terrain.png (block atlas), gui.png (UI atlas),
          # icons.png (hearts/crosshair), default8.png (font) — all ORIGINAL
          # MCPE 2013 textures copied from rujukan/ source code, NOT from the
          # modern VoxelCraft resource pack mirror.
          RUJUKAN=rujukan/pocket-edition-2013/mcpe-source/handheld/project/android/assets
          mkdir -p public/VoxelCraft/textures/blocks public/VoxelCraft/textures/gui public/VoxelCraft/font
          cp "$RUJUKAN/terrain.png" public/VoxelCraft/textures/blocks/terrain.png
          cp "$RUJUKAN/gui/gui.png" public/VoxelCraft/textures/gui/gui.png
          cp "$RUJUKAN/gui/icons.png" public/VoxelCraft/textures/gui/icons.png
          cp "$RUJUKAN/font/default8.png" public/VoxelCraft/font/default8.png
          test -f public/VoxelCraft/textures/blocks/terrain.png || { echo "Missing terrain.png"; exit 1; }
          test -f public/VoxelCraft/textures/gui/gui.png || { echo "Missing gui.png"; exit 1; }
          test -f public/VoxelCraft/textures/gui/icons.png || { echo "Missing icons.png"; exit 1; }
          test -f public/VoxelCraft/font/default8.png || { echo "Missing default8.png"; exit 1; }

      - name: Stage gui_buttons.png (pre-sliced from gui.png)
        run: |
          # gui_buttons.png is a pre-sliced 200x60 atlas cut from gui.png
          # at y=46/66/86 for normal/hover/pressed button states.
          # Generated by scripts/build_buttons_atlas.py from gui.png.
          if [ -f public/VoxelCraft/textures/gui/gui_buttons.png ]; then
            echo "gui_buttons.png already staged"
          else
            echo "Building gui_buttons.png from gui.png..."
            python3 scripts/build_buttons_atlas.py || echo "Build script not found, skipping"
          fi
          test -f public/VoxelCraft/textures/gui/gui_buttons.png || { echo "Missing gui_buttons.png"; exit 1; }

      - name: Stage original MCPE 2013 clouds texture
        run: |
          mkdir -p public/VoxelCraft/textures/environment
          cp rujukan/pocket-edition-2013/mcpe-source/handheld/project/android/assets/environment/clouds.png public/VoxelCraft/textures/environment/clouds.png
          test -f public/VoxelCraft/textures/environment/clouds.png || { echo "Missing clouds.png"; exit 1; }

      - name: Stage chicken model and texture from VoxelCraft RP
        run: |
          mkdir -p public/VoxelCraft/models/entity public/VoxelCraft/textures/entity/chicken
          cp VoxelCraft/models/entity/chicken.geo.json public/VoxelCraft/models/entity/chicken.geo.json
          cp VoxelCraft/textures/entity/chicken/chicken.png public/VoxelCraft/textures/entity/chicken/chicken.png
          test -f public/VoxelCraft/models/entity/chicken.geo.json || { echo "Missing chicken.geo.json"; exit 1; }
          test -f public/VoxelCraft/textures/entity/chicken/chicken.png || { echo "Missing chicken.png"; exit 1; }

      - name: Stage item icons from VoxelCraft RP
        run: |
          mkdir -p public/VoxelCraft/textures/items
          item_textures=(book_writable apple feather clock_item bed_red compass_item book_normal brick diamond)
          for name in "${item_textures[@]}"; do
            src="VoxelCraft/textures/items/${name}.png"
            test -f "$src" || { echo "Missing item icon: $src"; exit 1; }
            cp "$src" "public/VoxelCraft/textures/items/${name}.png"
          done

      - name: Build voxel engine bundle
        run: |
          if [ -f src/game/browser-entry.ts ]; then
            bun build src/game/browser-entry.ts --target browser --outfile public/voxelcraft-engine.bundle.js
          else
            echo "No src/game/browser-entry.ts found, skipping engine build"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Verify required output files
        run: |
          test -f out/index.html || { echo "Missing out/index.html"; exit 1; }
          test -f out/minecraft.html || { echo "Missing out/minecraft.html"; exit 1; }
          test -f out/VoxelCraft/textures/blocks/terrain.png || { echo "Missing terrain.png"; exit 1; }
          test -f out/VoxelCraft/textures/gui/gui.png || { echo "Missing gui.png"; exit 1; }
          test -f out/VoxelCraft/textures/gui/icons.png || { echo "Missing icons.png"; exit 1; }
          test -f out/VoxelCraft/textures/gui/gui_buttons.png || { echo "Missing gui_buttons.png"; exit 1; }
          test -f out/VoxelCraft/textures/environment/clouds.png || { echo "Missing clouds.png"; exit 1; }
          test -f out/VoxelCraft/font/default8.png || { echo "Missing default8.png"; exit 1; }
          test -f out/VoxelCraft/models/entity/chicken.geo.json || { echo "Missing chicken model"; exit 1; }
          test -f out/VoxelCraft/textures/entity/chicken/chicken.png || { echo "Missing chicken texture"; exit 1; }
          test -f out/VoxelCraft/textures/items/apple.png || { echo "Missing apple icon"; exit 1; }
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
