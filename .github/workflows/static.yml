name: Deploy Minecraft-only site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage vanilla assets used by the browser game
        run: |
          mkdir -p public/VoxelCraft/models/entity public/VoxelCraft/textures/entity/chicken public/VoxelCraft/textures/blocks
          cp VoxelCraft/models/entity/chicken.geo.json public/VoxelCraft/models/entity/chicken.geo.json
          cp VoxelCraft/textures/entity/chicken/chicken.png public/VoxelCraft/textures/entity/chicken/chicken.png
          # Keep deployed textures in sync with TEXTURE_FILES in minecraft.html.
          # Ore tiles are generated procedurally by buildAtlas and need no source PNG.
          textures=(
            grass_top grass_side_carried dirt stone cobblestone
            log_oak_top log_oak planks_oak leaves_oak_opaque sand
            gravel glass bedrock brick gold_block diamond_block iron_block coal_block
            crafting_table_top crafting_table_side crafting_table_front
            furnace_front_off furnace_side furnace_top water_still
            lapis_ore lapis_block redstone_ore redstone_block
            emerald_ore emerald_block copper_ore quartz_ore obsidian glowstone
            log_birch log_birch_top planks_birch leaves_birch_opaque
            log_spruce log_spruce_top planks_spruce leaves_spruce_opaque
            log_jungle log_jungle_top planks_jungle leaves_jungle_opaque
            log_acacia log_acacia_top planks_acacia leaves_acacia_opaque
            log_big_oak log_big_oak_top planks_big_oak
            stone_granite stone_granite_smooth stone_diorite stone_diorite_smooth
            stone_andesite stone_andesite_smooth stonebrick
            snow ice netherrack soul_sand bookshelf pumpkin_top pumpkin_side pumpkin_face_off sponge
            wool_colored_white wool_colored_black wool_colored_red wool_colored_blue wool_colored_green
          )
          for name in "${textures[@]}"; do
            src="VoxelCraft/textures/blocks/${name}.png"
            test -f "$src" || { echo "Missing vanilla texture source: $src"; exit 1; }
            cp "$src" "public/VoxelCraft/textures/blocks/${name}.png"
          done

      - name: Stage vanilla Bedrock UI sprites
        run: |
          mkdir -p public/VoxelCraft/textures/ui
          ui_textures=(
            menubackground background_panel background_with_border button_borderless_dark
            button_borderless_darkhover button_borderless_darkpressed dialog_background_opaque
            highlight_slot hotbar_start_cap hotbar_end_cap cancel inventory_icon
            hud_tip_text_background item_cell cursor_pc
            TabTopBack TabTopBackHover TabTopFront TabTopFrontHover
          )
          for name in "${ui_textures[@]}"; do
            src="VoxelCraft/textures/ui/${name}.png"
            test -f "$src" || { echo "Missing vanilla UI texture source: $src"; exit 1; }
            cp "$src" "public/VoxelCraft/textures/ui/${name}.png"
          done

      - name: Stage original Bedrock newgui button sprites
        run: |
          mkdir -p public/VoxelCraft/textures/gui/newgui
          gui_textures=(ButtonWithBorder ButtonWithBorderHover ButtonWithBorderPressed)
          for name in "${gui_textures[@]}"; do
            src="VoxelCraft/textures/gui/newgui/${name}.png"
            test -f "$src" || { echo "Missing original newgui texture source: $src"; exit 1; }
            cp "$src" "public/VoxelCraft/textures/gui/newgui/${name}.png"
          done

      - name: Stage Behavior Pack ActionForm icons
        run: |
          mkdir -p public/VoxelCraft/textures/items
          item_textures=(book_writable apple feather clock_item bed_red compass_item book_normal brick diamond)
          for name in "${item_textures[@]}"; do
            src="VoxelCraft/textures/items/${name}.png"
            test -f "$src" || { echo "Missing Behavior Pack menu icon source: $src"; exit 1; }
            cp "$src" "public/VoxelCraft/textures/items/${name}.png"
          done

      - name: Stage original Bedrock Minecraft Ten font
        run: |
          test -f VoxelCraft/font/minecraft-ten.ttf
          mkdir -p public/VoxelCraft/font
          cp VoxelCraft/font/minecraft-ten.ttf public/VoxelCraft/font/minecraft-ten.ttf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate game foundations
        run: bun run validate:game

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Verify Minecraft files
        run: |
          test -f out/index.html
          test -f out/minecraft.html
          test -d out/VoxelCraft/textures/blocks
          test -f out/VoxelCraft/textures/blocks/grass_top.png
          test -f out/VoxelCraft/textures/blocks/grass_side_carried.png
          test -f out/VoxelCraft/textures/blocks/leaves_oak_opaque.png
          test -f out/VoxelCraft/textures/blocks/furnace_top.png
          test -d out/VoxelCraft/textures/ui
          test -f out/VoxelCraft/textures/ui/menubackground.png
          test -f out/VoxelCraft/textures/ui/background_panel.png
          test -f out/VoxelCraft/textures/ui/background_with_border.png
          test -f out/VoxelCraft/textures/ui/button_borderless_dark.png
          test -f out/VoxelCraft/textures/ui/button_borderless_darkhover.png
          test -f out/VoxelCraft/textures/ui/button_borderless_darkpressed.png
          test -f out/VoxelCraft/textures/ui/dialog_background_opaque.png
          test -f out/VoxelCraft/textures/ui/highlight_slot.png
          test -f out/VoxelCraft/textures/ui/hotbar_start_cap.png
          test -f out/VoxelCraft/textures/ui/hotbar_end_cap.png
          test -f out/VoxelCraft/textures/ui/hud_tip_text_background.png
          test -f out/VoxelCraft/textures/ui/cancel.png
          test -f out/VoxelCraft/textures/ui/inventory_icon.png
          test -d out/VoxelCraft/textures/items
          test -f out/VoxelCraft/textures/items/book_writable.png
          test -f out/VoxelCraft/textures/items/apple.png
          test -f out/VoxelCraft/textures/items/feather.png
          test -f out/VoxelCraft/textures/items/clock_item.png
          test -f out/VoxelCraft/textures/items/bed_red.png
          test -f out/VoxelCraft/textures/items/compass_item.png
          test -f out/VoxelCraft/textures/items/book_normal.png
          test -f out/VoxelCraft/textures/items/brick.png
          test -f out/VoxelCraft/textures/items/diamond.png
          test -f out/VoxelCraft/textures/ui/item_cell.png
          test -f out/VoxelCraft/textures/ui/cursor_pc.png
          test -f out/VoxelCraft/textures/ui/TabTopBack.png
          test -f out/VoxelCraft/textures/ui/TabTopBackHover.png
          test -f out/VoxelCraft/textures/ui/TabTopFront.png
          test -f out/VoxelCraft/textures/ui/TabTopFrontHover.png
          test -d out/VoxelCraft/textures/gui/newgui
          test -f out/VoxelCraft/textures/gui/newgui/ButtonWithBorder.png
          test -f out/VoxelCraft/textures/gui/newgui/ButtonWithBorderHover.png
          test -f out/VoxelCraft/textures/gui/newgui/ButtonWithBorderPressed.png
          test -f out/VoxelCraft/textures/blocks/pumpkin_face_off.png
          test -f out/VoxelCraft/textures/blocks/log_spruce_top.png
          test -f out/VoxelCraft/textures/blocks/log_jungle_top.png
          test -f out/VoxelCraft/textures/blocks/log_acacia_top.png
          test -f out/VoxelCraft/textures/blocks/log_big_oak_top.png
          test -f out/VoxelCraft/font/minecraft-ten.ttf
          test -f out/VoxelCraft/models/entity/chicken.geo.json
          test -f out/VoxelCraft/textures/entity/chicken/chicken.png
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
