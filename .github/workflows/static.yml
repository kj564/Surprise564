name: Build and deploy VoxelCraft browser game to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Stage original MCPE 2013 textures from rujukan source
        run: |
          RUJUKAN=rujukan/pocket-edition-2013/mcpe-source/handheld/project/android/assets
          mkdir -p public/VoxelCraft/textures/blocks public/VoxelCraft/textures/gui \
                   public/VoxelCraft/font public/VoxelCraft/textures/environment \
                   public/VoxelCraft/textures/mob
          cp "$RUJUKAN/terrain.png" public/VoxelCraft/textures/blocks/terrain.png
          cp "$RUJUKAN/gui/gui.png" public/VoxelCraft/textures/gui/gui.png
          cp "$RUJUKAN/gui/icons.png" public/VoxelCraft/textures/gui/icons.png
          cp "$RUJUKAN/gui/items.png" public/VoxelCraft/textures/gui/items.png
          cp "$RUJUKAN/gui/gui_blocks.png" public/VoxelCraft/textures/gui/gui_blocks.png
          cp "$RUJUKAN/gui/title.png" public/VoxelCraft/textures/gui/title.png
          cp "$RUJUKAN/gui/background.png" public/VoxelCraft/textures/gui/background.png
          cp "$RUJUKAN/font/default8.png" public/VoxelCraft/font/default8.png
          cp "$RUJUKAN/environment/clouds.png" public/VoxelCraft/textures/environment/clouds.png
          cp "$RUJUKAN/mob/chicken.png" public/VoxelCraft/textures/mob/chicken.png
          cp "$RUJUKAN/particles.png" public/VoxelCraft/textures/particles.png

      - name: Build voxel engine bundle
        run: |
          if [ -f src/game/browser-entry.ts ]; then
            bun build src/game/browser-entry.ts --target browser --outfile public/voxelcraft-engine.bundle.js
          else
            echo "No src/game/browser-entry.ts, using committed bundle"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Verify output
        run: |
          test -f out/index.html || { echo "Missing index.html"; exit 1; }
          test -f out/minecraft.html || { echo "Missing minecraft.html"; exit 1; }
          test -f out/VoxelCraft/textures/blocks/terrain.png || { echo "Missing terrain.png"; exit 1; }
          test -f out/VoxelCraft/textures/gui/gui.png || { echo "Missing gui.png"; exit 1; }
          test -f out/VoxelCraft/textures/gui/icons.png || { echo "Missing icons.png"; exit 1; }
          test -f out/VoxelCraft/textures/gui/items.png || { echo "Missing items.png"; exit 1; }
          test -f out/VoxelCraft/textures/gui/title.png || { echo "Missing title.png"; exit 1; }
          test -f out/VoxelCraft/textures/environment/clouds.png || { echo "Missing clouds.png"; exit 1; }
          test -f out/VoxelCraft/textures/mob/chicken.png || { echo "Missing chicken.png"; exit 1; }
          test -f out/VoxelCraft/textures/particles.png || { echo "Missing particles.png"; exit 1; }
          test -f out/VoxelCraft/font/default8.png || { echo "Missing default8.png"; exit 1; }
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
