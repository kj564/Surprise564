# Build the Next.js app as static files and publish the export to GitHub Pages.
name: Deploy Next.js static export to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Publish the original iSpring samples without editing their source files.
      # Relative assets inside HTML/Ucapan and HTML/Materi continue to resolve as-is.
      - name: Include original HTML samples in the static site
        run: |
          mkdir -p public/HTML
          cp -a HTML/. public/HTML/

      - name: Build static site
        run: bun run build

      # Next's basePath rewrites framework assets, but literal public asset URLs
      # in the app must also include the repository path on GitHub Pages.
      - name: Fix public asset paths for project pages
        run: |
          find out -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) -print0 \
            | xargs -0 -r sed -i 's|/surprise/|/Surprise564/surprise/|g'
          touch out/.nojekyll
          test -f out/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
